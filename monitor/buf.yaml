version: v2
# 评估引擎不暴露 proto 接口：只有内部配置结构（internal/conf），
# 依赖 protobuf 内置类型与 kit 的共用配置结构（kitproto），无远程依赖、无 buf.lock。
modules:
  - path: internal
  # 各服务共用的配置结构：符号链接到 ../kit/proto（buf 不接受工作区目录之外的模块路径）。
  - path: kitproto
lint:
  use:
    - STANDARD
  ignore:
    # 共用配置结构在 kit 模块内 lint。
    - kitproto
  ignore_only:
    # 内部配置结构非对外 API，不携带版本后缀。
    PACKAGE_VERSION_SUFFIX:
      - internal/conf/conf.proto
breaking:
  use:
    - FILE
