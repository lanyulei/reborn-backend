# 服务启动配置；密钥类字段从环境变量注入，禁止在本文件写入明文口令。
server:
  http:
    # 8000 被本地前端 dev server 占用，后端固定走 8010（前端代理指到这里）。
    addr: 0.0.0.0:8010
    timeout: 5s
  # 本进程启用的角色：api（对外提供业务接口）/ worker（运行后台循环）。留空 = 全部（单进程部署）。
  # 环境变量 SERVER_ROLES（逗号分隔）优先。分开部署时须保证至少有一个进程承担 worker 角色。
  roles: []
data:
  database:
    # 本地开发 DSN；生产环境通过环境变量注入（KRATOS_DATA_DATABASE_SOURCE）。
    source: "host=127.0.0.1 user=postgres password=ekgGZebuZgCmyzv2WW5V dbname=reborn port=5432 sslmode=disable TimeZone=Asia/Shanghai"
    max_conns: 16
    min_conns: 2
    max_conn_idle_time: 1800s
  upload:
    # 本地上传文件（系统 logo / 头像 / 附件）落盘目录；需随部署持久化，多实例须为共享卷。
    dir: ./uploads
    # 新上传附件的存储驱动：local（附件落在 <dir>/files）或 s3（S3 兼容对象存储）。
    # 每个文件记录自己的驱动：切换后旧文件仍按原驱动读取，所以切到 s3 后本地目录仍须保留，
    # 从 s3 切回 local 后 s3 配置也须保留。
    driver: local
    # S3 兼容对象存储（AWS S3 / MinIO / 阿里云 OSS 的 S3 兼容端点等）；endpoint 留空 = 不启用。
    # 凭据不落配置文件，由环境变量注入：
    #   export KRATOS_DATA_UPLOAD_S3_ACCESS_KEY=...
    #   export KRATOS_DATA_UPLOAD_S3_SECRET_KEY=...
    s3:
      # 服务端点：http(s)://host[:port]，不含桶名与路径。
      endpoint: ""
      # 签名用的区域；留空取 us-east-1。
      region: ""
      # 桶须事先建好。
      bucket: ""
      access_key: ${DATA_UPLOAD_S3_ACCESS_KEY}
      secret_key: ${DATA_UPLOAD_S3_SECRET_KEY}
      # true = 路径式寻址（MinIO 常用）；false = 虚拟主机式。
      path_style: false
      # 对象键前缀，可空。
      prefix: ""
security:
  password:
    # Argon2id 参数；构造时校验不得低于 OWASP 下限（memory_kb≥19456, iterations≥2, parallelism≥1）。
    memory_kb: 65536
    iterations: 3
    parallelism: 4
  jwt:
    # secret 不落配置文件：占位符由 config resolver 从环境变量填充
    # （env.NewSource("KRATOS") 去掉 KRATOS_ 前缀后注入为 SECURITY_JWT_SECRET 键）：
    #   export KRATOS_SECURITY_JWT_SECRET=$(openssl rand -hex 32)
    # 未设置时解析为空串，装配阶段快速失败，不放占位默认值。
    secret: ${SECURITY_JWT_SECRET}
    # Duration 采用 protojson 秒格式（如 900s/604800s），不支持 15m 等简写。
    access_ttl: 900s
    refresh_ttl: 604800s
    issuer: monitor
  authz:
    # 策略快照惰性刷新 TTL：超出后首个请求触发重载（stale-serve 兜底），
    # 取值过小会放大数据库读放大，过大则跨实例生效延迟变长；界 1s~10m。
    policy_ttl: 30s
notify:
  master:
    # 通知渠道凭据（SMTP 密码/机器人 token/HMAC 密钥）AES-256-GCM 加密主密钥：
    # 占位符由 config resolver 从环境变量填充（env.NewSource("KRATOS") 去掉
    # KRATOS_ 前缀后注入为 NOTIFY_MASTER_KEY 键）：
    #   export KRATOS_NOTIFY_MASTER_KEY=$(openssl rand -hex 32)
    # 未设置时解析为空串：不带 secret 的渠道不受影响；创建/轮换带 secret 的
    # 渠道返回 NOTIFY_SECRET_UNAVAILABLE，绝不静默落明文。
    key: ${NOTIFY_MASTER_KEY}
assistant:
  # OpenAI 兼容模型接入；api_key 由环境变量注入（env.NewSource("KRATOS") 去掉
  # KRATOS_ 前缀后注入为 ASSISTANT_API_KEY 键）：
  #   export KRATOS_ASSISTANT_API_KEY=...
  # 未设置时解析为空串：助手停用（Chat 返回 ASSISTANT_DISABLED），其余功能照常。
  base_url: https://api.deepseek.com
  api_key: ${ASSISTANT_API_KEY}
  model: deepseek-flash
  # 工具执行回环：以用户身份调用本服务现有接口（权限由既有中间件判定）。
  loopback_addr: http://127.0.0.1:8010
  timeout: 300s
  llm_connect_timeout: 3s
  tool_timeout: 5s
  max_steps: 20
  max_concurrent_runs: 8
