version: v2
modules:
  - path: api
  - path: internal
  - path: third_party
deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  ignore:
    # 上游 Kratos 错误码扩展定义，按原样 vendored，不参与 lint。
    - third_party
  ignore_only:
    # 枚举值沿用 Kratos 错误码惯例（域前缀，如 USER_NOT_FOUND），
    # protoc-gen-go-errors 据此生成 ErrorUserNotFound 构造器。
    ENUM_VALUE_PREFIX:
      - api/system/v1/error_reason.proto
      - api/notify/v1/error_reason.proto
    # 内部配置结构非对外 API，不携带版本后缀。
    PACKAGE_VERSION_SUFFIX:
      - internal/conf/conf.proto
breaking:
  use:
    - FILE
