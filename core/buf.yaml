version: v2
modules:
  - path: api
  - path: internal
  # 各服务共用的配置结构：符号链接到 ../kit/proto（buf 不接受工作区目录之外的模块路径）。
  - path: kitproto
  - path: third_party
deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  ignore:
    # 上游 Kratos 错误码扩展定义，按原样 vendored，不参与 lint。
    - third_party
    # 共用配置结构在 kit 模块内 lint。
    - kitproto
  ignore_only:
    # 枚举值沿用 Kratos 错误码惯例（域前缀，如 USER_NOT_FOUND），
    # protoc-gen-go-errors 据此生成 ErrorUserNotFound 构造器。
    ENUM_VALUE_PREFIX:
      - api/system/v1/error_reason.proto
      - api/notify/v1/error_reason.proto
      - api/assistant/v1/error_reason.proto
      - api/cmdb/v1/error_reason.proto
      - api/oncall/v1/error_reason.proto
      - api/monitor/v1/error_reason.proto
      - api/job/v1/error_reason.proto
      - api/k8s/v1/error_reason.proto
    # 由 core 转发给容器平台数据面的接口：响应体是数据面返回的 JSON，原样透传（google.api.HttpBody）。
    RPC_RESPONSE_STANDARD_NAME:
      - api/k8s/v1/resource.proto
      - api/k8s/v1/helm.proto
      - api/k8s/v1/workload.proto
      - api/k8s/v1/insight.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - api/k8s/v1/resource.proto
      - api/k8s/v1/helm.proto
      - api/k8s/v1/workload.proto
      - api/k8s/v1/insight.proto
    # 内部配置结构非对外 API，不携带版本后缀。
    PACKAGE_VERSION_SUFFIX:
      - internal/conf/conf.proto
breaking:
  use:
    - FILE
