syntax = "proto3";

package conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/internal/conf;conf";

// Bootstrap 是服务启动配置的根结构，对应 configs/*.yaml。
message Bootstrap {
  // server 传输层服务器配置。
  Server server = 1;
  // data 数据层资源配置。
  Data data = 2;
  // security 安全相关配置（密码哈希等）。
  Security security = 3;
  // notify 通知域配置（渠道凭据加密等）。
  Notify notify = 4;
  // assistant 智能助手域配置（模型接入与 Agent 运行参数）。
  Assistant assistant = 5;
}

// Server 是 HTTP 服务器配置（仅 HTTP 协议；gRPC 已停用）。
message Server {
  // HTTP 是 HTTP 服务器配置。
  message HTTP {
    // network 监听网络类型，如 tcp；留空使用默认值。
    string network = 1;
    // addr 监听地址。
    string addr = 2;
    // timeout 请求处理超时。
    google.protobuf.Duration timeout = 3;
  }
  // http HTTP 配置。
  HTTP http = 1;
}

// Data 是数据层资源配置；密钥类字段一律从环境变量注入，禁止明文入库。
message Data {
  // Database 是 PostgreSQL 连接池配置（pgx）。
  message Database {
    // source 数据源 DSN；生产环境通过环境变量注入。
    string source = 1;
    // max_conns 最大连接数；0 使用驱动默认值。
    int32 max_conns = 2;
    // min_conns 最小空闲连接数；0 使用驱动默认值。
    int32 min_conns = 3;
    // max_conn_idle_time 连接最大空闲时长；未设置使用驱动默认值。
    google.protobuf.Duration max_conn_idle_time = 4;
  }
  // Upload 是本地上传文件的落盘配置。
  message Upload {
    // dir 上传文件存储目录（相对或绝对路径），容器/裸机部署均需持久化；
    // 留空使用默认值 ./uploads。
    string dir = 1;
  }
  // database 数据库配置。
  Database database = 1;
  // upload 上传文件配置。
  Upload upload = 2;
}

// Security 是安全相关配置。
message Security {
  // Authz 是接口授权（Casbin）参数；构造 NewAuthorizer 时校验。
  message Authz {
    // policy_ttl 策略内存快照的惰性刷新间隔，也是多实例部署下策略变更的
    // 收敛上界；1s-10m，典型 30s。绑定/停用/删角色每请求实时读库，不受此值影响。
    google.protobuf.Duration policy_ttl = 1;
  }
  // Password 是密码哈希（Argon2id）参数；构造时校验不得低于 OWASP 下限。
  message Password {
    // memory_kb 每次哈希内存开销，单位 KiB，不低于 19456。
    uint32 memory_kb = 1;
    // iterations 迭代次数，不低于 2。
    uint32 iterations = 2;
    // parallelism 并行度，不低于 1。
    uint32 parallelism = 3;
  }
  // Jwt 是访问令牌（JWT/HS256）签发与校验参数；构造 NewTokenSigner 时校验。
  message Jwt {
    // secret HS256 签名密钥，32-512 字节；一律经 KRATOS_SECURITY_JWT_SECRET
    // 环境变量注入，禁止写入配置文件（缺失时装配阶段快速失败）。
    string secret = 1;
    // access_ttl 访问令牌有效期，不低于 1m；典型 15m（短 TTL 缓解登出后的残留窗口）。
    google.protobuf.Duration access_ttl = 2;
    // refresh_ttl 刷新令牌有效期，须大于 access_ttl；典型 168h（7d）。
    google.protobuf.Duration refresh_ttl = 3;
    // issuer 签发方标识，非空；解析侧强制校验。
    string issuer = 4;
  }
  // password 密码哈希参数。
  Password password = 1;
  // jwt 访问令牌签发与校验参数。
  Jwt jwt = 2;
  // authz 接口授权参数。
  Authz authz = 3;
}

// Notify 是通知域配置。
message Notify {
  // Master 是渠道凭据加密主密钥配置。
  message Master {
    // key AES-256-GCM 主密钥（任意非空字节串，内部 SHA-256 派生 32 字节密钥）；
    // 一律经 KRATOS_NOTIFY_MASTER_KEY 环境变量注入（占位符 ${NOTIFY_MASTER_KEY}），
    // 禁止写入配置文件。为空时：无 secret 渠道不受影响，写入带 secret 的渠道
    // 报 NOTIFY_SECRET_UNAVAILABLE（快速失败，绝不静默落明文）。
    string key = 1;
  }
  // master 渠道凭据加密主密钥。
  Master master = 1;
  // dedup_ttl 业务直插（NotificationWriter）去重门闩有效期；未设置缺省 24h。
  // 与管道 ingress 同一 notify_dedup 表、同一语义（事件带 dedup_key 时生效）。
  google.protobuf.Duration dedup_ttl = 2;
}

// Assistant 是智能助手域配置：OpenAI 兼容模型接入 + Agent 运行参数。
// api_key 为空表示助手停用（Chat 返回 ASSISTANT_DISABLED），其余功能不受影响。
message Assistant {
  // base_url OpenAI 兼容接口根地址（如 https://open.bigmodel.cn/api/paas/v4）。
  string base_url = 1;
  // api_key 模型 API Key；一律经 KRATOS_ASSISTANT_API_KEY 环境变量注入
  //（占位符 ${ASSISTANT_API_KEY}），禁止写入配置文件；为空即停用助手。
  string api_key = 2;
  // model 模型名（如 glm-4.5-flash）。
  string model = 3;
  // loopback_addr 工具执行回环地址（本服务 HTTP 根，如 http://127.0.0.1:8010）。
  string loopback_addr = 4;
  // timeout 单轮 Agent 运行上限（含模型生成与工具调用），也是会话租约 TTL；缺省 5m。
  google.protobuf.Duration timeout = 5;
  // llm_connect_timeout 模型连接建立超时；缺省 3s。
  google.protobuf.Duration llm_connect_timeout = 6;
  // tool_timeout 单次工具（回环接口）调用超时；缺省 5s。
  google.protobuf.Duration tool_timeout = 7;
  // max_steps 单轮最多模型调用次数（防循环）；缺省 20。
  int32 max_steps = 8;
  // max_concurrent_runs 单实例并发轮次上限（自我保护）；缺省 8。
  int32 max_concurrent_runs = 9;
}
