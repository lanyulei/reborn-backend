syntax = "proto3";

package conf;

import "google/protobuf/duration.proto";
import "kitconf/common.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/internal/conf;conf";

// Bootstrap 是服务启动配置的根结构，对应 configs/*.yaml。
message Bootstrap {
  // server 传输层服务器配置。
  Server server = 1;
  // data 数据层资源配置。
  Data data = 2;
  // security 安全相关配置（密码哈希等）。
  Security security = 3;
  // notify 通知域配置（渠道凭据加密等）。
  Notify notify = 4;
  // assistant 智能助手域配置（模型接入与 Agent 运行参数）。
  Assistant assistant = 5;
  // monitor 监控告警域配置（通知链接的站点地址、出站地址限制）。
  Monitor monitor = 6;
  // k8s 容器平台域配置（与数据面之间的内部密钥、Agent 安装参数）。
  K8s k8s = 7;
  // knowledge 知识库域配置（embedding 服务接入、索引与检索参数）。
  Knowledge knowledge = 8;
  // agent 运维 Agent 域配置（任务预算、并发、保留期）；整段可省略 = 停用。
  Agent agent = 9;
  // oncall 值班域配置（历史数据的保留期）；整段可省略。
  Oncall oncall = 10;
}

// Server 是 HTTP 服务器配置（仅 HTTP 协议；gRPC 已停用）。
message Server {
  // http HTTP 配置。
  kitconf.HTTP http = 1;
  // roles 本进程启用的角色：api（对外提供业务接口）/ worker（运行后台循环：值班、附件清理、
  // 流程作业、工单 SLA 巡检）。环境变量 SERVER_ROLES（逗号分隔）优先；两者皆空 = 全部角色
  //（单进程部署）。分开部署时须保证至少有一个进程承担 worker 角色。
  repeated string roles = 2;
}

// Data 是数据层资源配置；密钥类字段一律从环境变量注入，禁止明文入库。
message Data {
  // Upload 是上传文件的存储配置。
  message Upload {
    // S3 是 S3 兼容对象存储（AWS S3 / MinIO / 阿里云 OSS 的 S3 兼容端点等）的连接参数；
    // endpoint 非空即登记 s3 驱动，装配阶段校验，配置不全快速失败。
    message S3 {
      // endpoint 服务端点：http(s)://host[:port]，不含桶名与路径。
      string endpoint = 1;
      // region 签名用的区域；留空取 us-east-1（MinIO 等不分区域的服务的默认值）。
      string region = 2;
      // bucket 桶名（须已存在）。
      string bucket = 3;
      // access_key 访问密钥 ID；经 KRATOS_DATA_UPLOAD_S3_ACCESS_KEY 环境变量注入。
      string access_key = 4;
      // secret_key 访问密钥；一律经 KRATOS_DATA_UPLOAD_S3_SECRET_KEY 环境变量注入，不落配置文件。
      string secret_key = 5;
      // path_style 路径式寻址（<endpoint>/<bucket>/<key>，MinIO 常用）；
      // false 为虚拟主机式（<bucket>.<endpoint>/<key>）。
      bool path_style = 6;
      // prefix 对象键前缀，可空（多个环境共用一个桶时区分）。
      string prefix = 7;
    }
    // dir 上传文件存储目录（相对或绝对路径），容器/裸机部署均需持久化；
    // 留空使用默认值 ./uploads。
    string dir = 1;
    // driver 新上传文件（系统 logo / 头像 / 附件）使用的存储驱动：local（本地磁盘，<dir>/files；
    // 留空的缺省值）或 s3。
    // 多实例部署时本地驱动的 dir 须为共享卷。每个文件记录自己的驱动，切换后旧文件仍按原驱动读取。
    string driver = 2;
    // s3 S3 兼容对象存储的连接参数；driver = s3 时必填。
    S3 s3 = 3;
  }
  // database 数据库配置。
  kitconf.Database database = 1;
  // upload 上传文件配置。
  Upload upload = 2;
}

// Security 是安全相关配置。
message Security {
  // Authz 是接口授权（Casbin）参数；构造 NewAuthorizer 时校验。
  message Authz {
    // policy_ttl 策略内存快照的惰性刷新间隔，也是多实例部署下策略变更的
    // 收敛上界；1s-10m，典型 30s。绑定/停用/删角色每请求实时读库，不受此值影响。
    google.protobuf.Duration policy_ttl = 1;
  }
  // Password 是密码哈希（Argon2id）参数；构造时校验不得低于 OWASP 下限。
  message Password {
    // memory_kb 每次哈希内存开销，单位 KiB，不低于 19456。
    uint32 memory_kb = 1;
    // iterations 迭代次数，不低于 2。
    uint32 iterations = 2;
    // parallelism 并行度，不低于 1。
    uint32 parallelism = 3;
  }
  // Jwt 是访问令牌（JWT/HS256）签发与校验参数；构造 NewTokenSigner 时校验。
  message Jwt {
    // secret HS256 签名密钥，32-512 字节；一律经 KRATOS_SECURITY_JWT_SECRET
    // 环境变量注入，禁止写入配置文件（缺失时装配阶段快速失败）。
    string secret = 1;
    // access_ttl 访问令牌有效期，不低于 1m；典型 15m（短 TTL 缓解登出后的残留窗口）。
    google.protobuf.Duration access_ttl = 2;
    // refresh_ttl 刷新令牌有效期，须大于 access_ttl；典型 168h（7d）。
    google.protobuf.Duration refresh_ttl = 3;
    // issuer 签发方标识，非空；解析侧强制校验。
    string issuer = 4;
  }
  // password 密码哈希参数。
  Password password = 1;
  // jwt 访问令牌签发与校验参数。
  Jwt jwt = 2;
  // authz 接口授权参数。
  Authz authz = 3;
}

// Notify 是通知域配置。
message Notify {
  // master 渠道凭据加密主密钥。
  kitconf.Master master = 1;
  // dedup_ttl 业务直插（NotificationWriter）去重门闩有效期；未设置缺省 24h。
  // 与管道 ingress 同一 notify_dedup 表、同一语义（事件带 dedup_key 时生效）。
  google.protobuf.Duration dedup_ttl = 2;
}

// Assistant 是智能助手域配置：OpenAI 兼容模型接入 + Agent 运行参数。
// api_key 为空表示助手停用（Chat 返回 ASSISTANT_DISABLED），其余功能不受影响。
message Assistant {
  // base_url OpenAI 兼容接口根地址（如 https://open.bigmodel.cn/api/paas/v4）。
  string base_url = 1;
  // api_key 模型 API Key；一律经 KRATOS_ASSISTANT_API_KEY 环境变量注入
  //（占位符 ${ASSISTANT_API_KEY}），禁止写入配置文件；为空即停用助手。
  string api_key = 2;
  // model 模型名（如 glm-4.5-flash）。
  string model = 3;
  // loopback_addr 工具执行回环地址（本服务 HTTP 根，如 http://127.0.0.1:8010）。
  string loopback_addr = 4;
  // timeout 单轮 Agent 运行上限（含模型生成与工具调用），也是会话租约 TTL；缺省 5m。
  google.protobuf.Duration timeout = 5;
  // llm_connect_timeout 模型连接建立超时；缺省 3s。
  google.protobuf.Duration llm_connect_timeout = 6;
  // tool_timeout 单次工具（回环接口）调用超时；缺省 5s。
  google.protobuf.Duration tool_timeout = 7;
  // max_steps 单轮最多模型调用次数（防循环）；缺省 20。
  int32 max_steps = 8;
  // max_concurrent_runs 单实例并发轮次上限（自我保护）；缺省 8。
  int32 max_concurrent_runs = 9;
}

// Agent 是运维 Agent 域配置；整段可省略（省略时 Agent 停用：不领取任务，接口返回 AGENT_DISABLED）。
// 模型接入、API Key 与工具执行回环地址沿用 assistant 段（Agent 复用助手的模型客户端与回环执行器）。
message Agent {
  // enabled 是否启用；assistant.api_key 为空时即使 enabled 也不可用。
  bool enabled = 1;
  // task_timeout 单任务时限（Profile 预算未设置时的缺省），缺省 8m。
  google.protobuf.Duration task_timeout = 2;
  // max_steps 单任务最多模型调用次数（Profile 预算未设置时的缺省），缺省 20。
  int32 max_steps = 3;
  // max_concurrent_tasks 单实例并发任务数，缺省 3。
  int32 max_concurrent_tasks = 4;
  // daily_prompt_token_budget 全局日 prompt token 预算，缺省 2000000；耗尽后新任务直接 expired。
  int64 daily_prompt_token_budget = 5;
  // daily_completion_token_budget 全局日 completion token 预算，缺省 300000。
  int64 daily_completion_token_budget = 6;
  // tool_timeout_overrides 按工具（proto full method）的回环调用超时覆盖（日志 / 诊断类接口用），其余沿用 assistant.tool_timeout。
  map<string, google.protobuf.Duration> tool_timeout_overrides = 7;
  // retention 运行记录与其助手会话的保留期，缺省 2160h（90 天）。
  google.protobuf.Duration retention = 8;
  // queue_ttl 排队超时：超过未执行的任务直接 expired，缺省 10m。
  google.protobuf.Duration queue_ttl = 9;
  // retry_backoff 失败重试退避序列，缺省 [30s, 2m, 10m]；长度即最多重试次数。
  repeated google.protobuf.Duration retry_backoff = 10;
}

// Monitor 是监控告警域配置；整段可省略。
message Monitor {
  // site_url 前端站点地址（如 https://ops.example.com，不带结尾斜杠也可）。非空时告警通知里的详情
  // 链接为 site_url + /monitor/alert/<id>；为空时是站内相对路径。
  string site_url = 1;
  // block_loopback 测试连接 / 即时查询是否拒绝指向回环地址（127.0.0.0/8、::1、localhost）的数据源。
  // 缺省 false：时序库与本服务同机部署时需要访问回环地址。链路本地与云元数据地址恒拒绝。
  bool block_loopback = 2;
  // ci_match_attrs 可用于「告警关联资源」的 CMDB 属性（字段编码，小写字母开头，只含小写字母、数字、下划线）：
  // 只有列在这里的属性会被物化进 monitor_ci_index 供评估引擎匹配。缺省 ["ip"]。
  repeated string ci_match_attrs = 3;
  // topology_relations 拓扑抑制与影响面所用的 CMDB 关系类型，每项形如 "<关系类型编码>:<上游一侧>"，上游一侧取
  // src 或 dst（上游影响下游）。缺省 ["host_runs_vm:src", "uplink:dst"]：物理机是其虚拟机的上游，
  // 上联的网络设备是接入它的设备的上游。
  repeated string topology_relations = 4;
  // engine_notify_roles 平台自监控通知（monitor.engine.*）的收件角色编码：持有其中任一角色的可用用户。
  // 留空 = 不指定收件人，交由通知路由的固定收件人与订阅者决定。
  repeated string engine_notify_roles = 5;
  // ai_summary_timeout 生成一条 AI 摘要的时间上限；缺省 30s，至多 120s。
  google.protobuf.Duration ai_summary_timeout = 6;
}

// K8s 是容器平台域配置；整段可省略（省略时集群登记可用，资源类接口返回 503）。
message K8s {
  // Agent 是生成 Agent 安装清单 / 命令所需的参数。
  message Agent {
    // server_url 数据面 Agent 隧道入口的对外地址（如 https://k8s-tunnel.example.com），所有集群都要能访问到。
    string server_url = 1;
    // image Agent 镜像（如 registry.example.com/reborn/k8s-agent:v1.0.0）。
    string image = 2;
  }
  // internal_key core 与数据面之间的身份头签名密钥，至少 32 字节；一律经 KRATOS_K8S_INTERNAL_KEY
  // 环境变量注入，须与数据面的 plane.internal_key 相同。为空时资源类接口返回 503 K8S_PLANE_UNAVAILABLE。
  string internal_key = 1;
  // agent Agent 安装参数；未配置时「生成 Agent 安装命令」返回 503 K8S_AGENT_UNCONFIGURED。
  Agent agent = 2;
  // allowed_origins Web 终端 WebSocket 额外允许的 Origin 主机（host[:port]，如开发服务器 localhost:8000）；
  // 同源请求恒允许。
  repeated string allowed_origins = 3;
  // plane_timeout 普通请求转发到数据面的超时；缺省 30s。
  google.protobuf.Duration plane_timeout = 4;
  // Kubeconfig 限时 kubeconfig 的参数。
  message Kubeconfig {
    // server_url 平台的对外地址（如 https://ops.example.com），写进签发的 kubeconfig；
    // 为空时由前端按当前站点地址拼接。kubectl 须能访问到它。
    string server_url = 1;
    // max_ttl 最长有效期，缺省且上限 7 天。
    google.protobuf.Duration max_ttl = 2;
  }
  // kubeconfig 限时 kubeconfig 参数。
  Kubeconfig kubeconfig = 5;
}

// Knowledge 是知识库域配置；整段可省略（省略时知识库可用，检索退化为纯全文）。
message Knowledge {
  // Embedding 是向量化服务（OpenAI 兼容 /v1/embeddings）接入参数；与 assistant 的对话模型分离，
  // 二者通常不是同一供应商。api_key 为空即不向量化。
  message Embedding {
    // base_url OpenAI 兼容接口根地址（如 https://api.siliconflow.cn/v1）。
    string base_url = 1;
    // api_key 一律经 KRATOS_KNOWLEDGE_EMBEDDING_API_KEY 环境变量注入（占位符 ${KNOWLEDGE_EMBEDDING_API_KEY}）；
    // 为空即停用向量化，检索只走全文。
    string api_key = 2;
    // model 模型名（如 BAAI/bge-m3）。向量维度固定 1024：支持 dimensions 参数的模型按 1024 请求，
    // 固定维度的模型须本身为 1024 维；维度不符的结果被拒绝并记入索引任务失败原因。
    string model = 3;
    // batch_size 单次请求的分块数上限；缺省 32，上限 128。
    int32 batch_size = 4;
    // timeout 单次请求超时；缺省 30s。
    google.protobuf.Duration timeout = 5;
  }
  // embedding 向量化服务。
  Embedding embedding = 1;
  // search_log_retention 检索日志保留期；缺省 90 天（2160h = 7776000s）。
  google.protobuf.Duration search_log_retention = 2;
  // index_concurrency 单实例同时处理的索引任务数；缺省 2。
  int32 index_concurrency = 3;
  // ingest_job_retention 已结束（成功 / 失败）的文件导入任务保留期，到期后由后台循环 knowledge-purge
  // 分批物理删除；缺省 720h（30 天）。未设置取缺省值，显式 0s = 不清理。
  google.protobuf.Duration ingest_job_retention = 4;
}

// Oncall 是值班域配置；整段可省略（省略时各项取缺省值）。
message Oncall {
  // deleted_schedule_shift_retention 已删除值班表的班次保留期，到期后由后台循环 oncall-purge 分批物理删除；
  // 缺省 720h（30 天）。未设置取缺省值，显式 0s = 不清理。
  google.protobuf.Duration deleted_schedule_shift_retention = 1;
}
