syntax = "proto3";

package job.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "system/v1/annotations.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/api/job/v1;v1";

// JobCredentialService 作业凭据：登录目标主机的 SSH 账号（私钥或密码）与提权方式。
// 密文只写不读：任何接口都不返回私钥、密码与提权密码；只有执行引擎在派发任务时解密。
service JobCredentialService {
  // ListJobCredentials 分页查询凭据。
  rpc ListJobCredentials(ListJobCredentialsRequest) returns (ListJobCredentialsResponse) {
    option (google.api.http) = {get: "/api/v1/job/credential"};
    option (system.v1.title) = "查询作业凭据";
  }
  // GetJobCredential 查询凭据详情。
  rpc GetJobCredential(GetJobCredentialRequest) returns (GetJobCredentialResponse) {
    option (google.api.http) = {get: "/api/v1/job/credential/{id}"};
    option (system.v1.title) = "查询作业凭据详情";
  }
  // CreateJobCredential 新建凭据；名称重复返回 409 JOB_CREDENTIAL_NAME_EXISTS。
  rpc CreateJobCredential(CreateJobCredentialRequest) returns (CreateJobCredentialResponse) {
    option (google.api.http) = {
      post: "/api/v1/job/credential"
      body: "*"
    };
    option (system.v1.title) = "新建作业凭据";
  }
  // UpdateJobCredential 编辑凭据（整体替换；secret / become_secret 不传则保留原值）。
  // version 不一致返回 409 JOB_VERSION_CONFLICT。
  rpc UpdateJobCredential(UpdateJobCredentialRequest) returns (UpdateJobCredentialResponse) {
    option (google.api.http) = {
      put: "/api/v1/job/credential/{id}"
      body: "*"
    };
    option (system.v1.title) = "编辑作业凭据";
  }
  // DeleteJobCredential 删除凭据；仍被作业模板使用时拒绝（409 JOB_CREDENTIAL_IN_USE）。
  rpc DeleteJobCredential(DeleteJobCredentialRequest) returns (DeleteJobCredentialResponse) {
    option (google.api.http) = {delete: "/api/v1/job/credential/{id}"};
    option (system.v1.title) = "删除作业凭据";
  }
  // ListJobCredentialOptions 凭据下拉选项（仅 ID、名称、类型、用户名）；供编辑作业模板时选择。
  rpc ListJobCredentialOptions(ListJobCredentialOptionsRequest) returns (ListJobCredentialOptionsResponse) {
    option (google.api.http) = {get: "/api/v1/job/credential-option"};
    option (system.v1.title) = "查询作业凭据选项";
  }
}

// JobCredentialSpec 凭据的可编辑内容（新建与编辑共用）。
message JobCredentialSpec {
  // name 名称，1-64 字符，全局唯一。
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // type 类型：1=SSH 私钥 2=SSH 密码。
  int32 type = 2 [(buf.validate.field).int32 = {
    in: [
      1,
      2
    ]
  }];
  // username 登录用户名，1-64 字符：字母、数字、下划线、点、连字符，不以连字符开头。
  string username = 3 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9_.][A-Za-z0-9_.-]{0,63}$"}];
  // secret 私钥（OpenSSH / PEM 格式，不支持带口令的私钥）或密码，只写不读。新建时必填；
  // 编辑时不传表示保留原值（更换类型时必须重新填写）。
  optional string secret = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16384
  }];
  // become_method 提权方式：空=不提权 sudo su。
  string become_method = 5 [(buf.validate.field).string = {
    in: [
      "",
      "sudo",
      "su"
    ]
  }];
  // become_user 提权目标用户，可选，空按 root；格式同 username。
  string become_user = 6 [(buf.validate.field).string = {pattern: "^([A-Za-z0-9_.][A-Za-z0-9_.-]{0,63})?$"}];
  // become_secret 提权密码，只写不读，可选（免密提权时不填）。编辑时不传表示保留原值，
  // 传空字符串表示清除。
  optional string become_secret = 7 [(buf.validate.field).string.max_len = 1024];
  // description 说明，可选。
  string description = 8 [(buf.validate.field).string.max_len = 255];
}

// JobCredential 作业凭据。
message JobCredential {
  // id 凭据唯一标识。
  string id = 1;
  // spec 凭据内容；其中 secret / become_secret 恒不返回，是否已配置见 has_become_secret。
  JobCredentialSpec spec = 2;
  // has_become_secret 是否已保存提权密码。
  bool has_become_secret = 3;
  // fingerprint 私钥的公钥指纹（SHA256:...），便于核对是哪一把钥匙；密码类型为空。
  string fingerprint = 4;
  // template_count 使用本凭据的作业模板数；大于 0 时不可删除。
  int32 template_count = 5;
  // version 乐观锁版本号，编辑时原样传回。
  int32 version = 6;
  // create_time 创建时间。
  google.protobuf.Timestamp create_time = 7;
  // update_time 更新时间。
  google.protobuf.Timestamp update_time = 8;
  // update_user_id 最近更新人。
  string update_user_id = 9;
  // update_user_name 最近更新人显示名。
  string update_user_name = 10;
}

// ListJobCredentialsRequest 分页查询凭据请求。
message ListJobCredentialsRequest {
  // page 页码，从 1 开始。
  int64 page = 1 [(buf.validate.field).int64.gte = 1];
  // page_size 每页数量，1-100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // keyword 名称 / 用户名 / 说明模糊匹配，可选。
  optional string keyword = 3 [(buf.validate.field).string.max_len = 64];
  // type 类型过滤，可选：1=SSH 私钥 2=SSH 密码。
  optional int32 type = 4 [(buf.validate.field).int32 = {
    in: [
      1,
      2
    ]
  }];
}

// ListJobCredentialsResponse 分页查询凭据响应。
message ListJobCredentialsResponse {
  // items 当前页数据。
  repeated JobCredential items = 1;
  // total 总数。
  int64 total = 2;
}

// GetJobCredentialRequest 查询凭据详情请求。
message GetJobCredentialRequest {
  // id 凭据唯一标识。
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetJobCredentialResponse 查询凭据详情响应。
message GetJobCredentialResponse {
  // credential 凭据。
  JobCredential credential = 1;
}

// CreateJobCredentialRequest 新建凭据请求。
message CreateJobCredentialRequest {
  // spec 凭据内容。
  JobCredentialSpec spec = 1 [(buf.validate.field).required = true];
}

// CreateJobCredentialResponse 新建凭据响应。
message CreateJobCredentialResponse {
  // credential 新建的凭据。
  JobCredential credential = 1;
}

// UpdateJobCredentialRequest 编辑凭据请求。
message UpdateJobCredentialRequest {
  // id 凭据唯一标识。
  string id = 1 [(buf.validate.field).string.uuid = true];
  // spec 凭据内容，整体替换；secret / become_secret 不传表示保留原值。
  JobCredentialSpec spec = 2 [(buf.validate.field).required = true];
  // version 乐观锁版本号，须与当前一致。
  int32 version = 3 [(buf.validate.field).int32.gte = 1];
}

// UpdateJobCredentialResponse 编辑凭据响应。
message UpdateJobCredentialResponse {
  // credential 更新后的凭据。
  JobCredential credential = 1;
}

// DeleteJobCredentialRequest 删除凭据请求。
message DeleteJobCredentialRequest {
  // id 凭据唯一标识。
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteJobCredentialResponse 删除凭据响应。
message DeleteJobCredentialResponse {}

// ListJobCredentialOptionsRequest 查询凭据选项请求。
message ListJobCredentialOptionsRequest {}

// JobCredentialOption 凭据选项。
message JobCredentialOption {
  // id 凭据唯一标识。
  string id = 1;
  // name 名称。
  string name = 2;
  // type 类型：1=SSH 私钥 2=SSH 密码。
  int32 type = 3;
  // username 登录用户名。
  string username = 4;
  // become_method 提权方式：空=不提权 sudo su。
  string become_method = 5;
}

// ListJobCredentialOptionsResponse 查询凭据选项响应。
message ListJobCredentialOptionsResponse {
  // items 全部凭据，按名称排序，至多 500 个。
  repeated JobCredentialOption items = 1;
}
