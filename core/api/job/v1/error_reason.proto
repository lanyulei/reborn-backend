syntax = "proto3";

package job.v1;

import "errors/errors.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/api/job/v1;v1";

// ErrorReason 是作业中心域的业务错误码枚举，由 protoc-gen-go-errors 生成带 code 的
// 错误构造器。枚举值沿用 Kratos 错误码惯例（域前缀），豁免 ENUM_VALUE_PREFIX。
enum ErrorReason {
  option (errors.default_code) = 500;
  // JOB_UNSPECIFIED 未指定的作业中心错误。
  JOB_UNSPECIFIED = 0;
  // JOB_VERSION_CONFLICT 数据已被他人修改（version 不一致），请刷新后重试，映射 HTTP 409。
  JOB_VERSION_CONFLICT = 1 [(errors.code) = 409];
  // JOB_SECRET_UNAVAILABLE 加密主密钥未配置，无法保存凭据，映射 HTTP 503。
  JOB_SECRET_UNAVAILABLE = 2 [(errors.code) = 503];

  // JOB_CREDENTIAL_NOT_FOUND 凭据不存在，映射 HTTP 404。
  JOB_CREDENTIAL_NOT_FOUND = 10 [(errors.code) = 404];
  // JOB_CREDENTIAL_NAME_EXISTS 凭据名称已被占用，映射 HTTP 409。
  JOB_CREDENTIAL_NAME_EXISTS = 11 [(errors.code) = 409];
  // JOB_CREDENTIAL_INVALID 凭据内容不合法（私钥无法解析、带口令的私钥、缺少密码等），映射 HTTP 400。
  JOB_CREDENTIAL_INVALID = 12 [(errors.code) = 400];
  // JOB_CREDENTIAL_IN_USE 凭据仍被作业模板使用，不可删除，映射 HTTP 409。
  JOB_CREDENTIAL_IN_USE = 13 [(errors.code) = 409];

  // JOB_PROJECT_NOT_FOUND 项目不存在，映射 HTTP 404。
  JOB_PROJECT_NOT_FOUND = 20 [(errors.code) = 404];
  // JOB_PROJECT_NAME_EXISTS 项目名称已被占用，映射 HTTP 409。
  JOB_PROJECT_NAME_EXISTS = 21 [(errors.code) = 409];
  // JOB_PROJECT_INVALID 项目配置不合法（仓库地址、分支、认证方式与地址不匹配等），映射 HTTP 400。
  JOB_PROJECT_INVALID = 22 [(errors.code) = 400];
  // JOB_PROJECT_IN_USE 项目仍被作业模板使用，不可删除，映射 HTTP 409。
  JOB_PROJECT_IN_USE = 23 [(errors.code) = 409];

  // JOB_TEMPLATE_NOT_FOUND 作业模板不存在，映射 HTTP 404。
  JOB_TEMPLATE_NOT_FOUND = 30 [(errors.code) = 404];
  // JOB_TEMPLATE_NAME_EXISTS 作业模板名称已被占用，映射 HTTP 409。
  JOB_TEMPLATE_NAME_EXISTS = 31 [(errors.code) = 409];
  // JOB_TEMPLATE_INVALID 作业模板配置不合法（Playbook 路径、目标主机、参数定义、执行选项等），映射 HTTP 400。
  JOB_TEMPLATE_INVALID = 32 [(errors.code) = 400];
  // JOB_TEMPLATE_DISABLED 作业模板已停用，不可执行，映射 HTTP 409。
  JOB_TEMPLATE_DISABLED = 33 [(errors.code) = 409];

  // JOB_TARGET_FORBIDDEN 目标主机超出了当前用户的 CMDB 数据范围，映射 HTTP 403。
  JOB_TARGET_FORBIDDEN = 40 [(errors.code) = 403];
  // JOB_TARGET_INVALID 目标主机不合法（没有匹配的主机、超过上限、地址为空或不合法、地址重复、
  // 指定的主机不在模板的目标范围内等），映射 HTTP 400。
  JOB_TARGET_INVALID = 41 [(errors.code) = 400];
  // JOB_PARAMS_INVALID 执行参数取值不合法（缺少必填项、类型不符、不在可选值内、未定义的参数），映射 HTTP 400。
  JOB_PARAMS_INVALID = 42 [(errors.code) = 400];
  // JOB_EXECUTION_NOT_FOUND 执行记录不存在，映射 HTTP 404。
  JOB_EXECUTION_NOT_FOUND = 43 [(errors.code) = 404];
  // JOB_EXECUTION_CONFLICT 该模板禁止并发，且已有未结束的执行，映射 HTTP 409。
  JOB_EXECUTION_CONFLICT = 44 [(errors.code) = 409];
  // JOB_EXECUTION_FINISHED 执行已结束，不能取消，映射 HTTP 409。
  JOB_EXECUTION_FINISHED = 45 [(errors.code) = 409];

  // JOB_RISK_BLOCKED 命令或脚本命中了「拦截」类高危规则，不允许提交，映射 HTTP 403。
  JOB_RISK_BLOCKED = 46 [(errors.code) = 403];
  // JOB_APPROVAL_UNAVAILABLE 本次执行须审批，但尚未配置审批流程或流程当前不可发起，映射 HTTP 409。
  JOB_APPROVAL_UNAVAILABLE = 47 [(errors.code) = 409];
  // JOB_ADHOC_INVALID 快速执行的内容不合法（命令 / 脚本为空或过长、文件不存在或过大、目标路径不合法等），映射 HTTP 400。
  JOB_ADHOC_INVALID = 48 [(errors.code) = 400];
  // JOB_RUN_FORBIDDEN 定时作业 / 触发器的保存人（即负责人）没有执行作业的权限，映射 HTTP 403。
  JOB_RUN_FORBIDDEN = 49 [(errors.code) = 403];

  // JOB_RUNNER_NOT_FOUND 执行节点不存在，映射 HTTP 404。
  JOB_RUNNER_NOT_FOUND = 50 [(errors.code) = 404];
  // JOB_RUNNER_NAME_EXISTS 执行节点名称已被占用，映射 HTTP 409。
  JOB_RUNNER_NAME_EXISTS = 51 [(errors.code) = 409];
  // JOB_RUNNER_INVALID 执行节点配置不合法（区域名等），映射 HTTP 400。
  JOB_RUNNER_INVALID = 52 [(errors.code) = 400];

  // JOB_SCRIPT_NOT_FOUND 脚本不存在，映射 HTTP 404。
  JOB_SCRIPT_NOT_FOUND = 60 [(errors.code) = 404];
  // JOB_SCRIPT_NAME_EXISTS 脚本名称已被占用，映射 HTTP 409。
  JOB_SCRIPT_NAME_EXISTS = 61 [(errors.code) = 409];
  // JOB_SCRIPT_INVALID 脚本内容不合法，映射 HTTP 400。
  JOB_SCRIPT_INVALID = 62 [(errors.code) = 400];

  // JOB_RISK_RULE_NOT_FOUND 高危命令规则不存在，映射 HTTP 404。
  JOB_RISK_RULE_NOT_FOUND = 70 [(errors.code) = 404];
  // JOB_RISK_RULE_NAME_EXISTS 高危命令规则名称已被占用，映射 HTTP 409。
  JOB_RISK_RULE_NAME_EXISTS = 71 [(errors.code) = 409];
  // JOB_RISK_RULE_INVALID 高危命令规则不合法（正则无法编译等），映射 HTTP 400。
  JOB_RISK_RULE_INVALID = 72 [(errors.code) = 400];
  // JOB_POLICY_INVALID 全局策略不合法（审批流程不存在或不可发起等），映射 HTTP 400。
  JOB_POLICY_INVALID = 73 [(errors.code) = 400];

  // JOB_SCHEDULE_NOT_FOUND 定时作业不存在，映射 HTTP 404。
  JOB_SCHEDULE_NOT_FOUND = 80 [(errors.code) = 404];
  // JOB_SCHEDULE_NAME_EXISTS 定时作业名称已被占用，映射 HTTP 409。
  JOB_SCHEDULE_NAME_EXISTS = 81 [(errors.code) = 409];
  // JOB_SCHEDULE_INVALID 定时作业不合法（Cron 表达式、时区、参数取值、模板不存在等），映射 HTTP 400。
  JOB_SCHEDULE_INVALID = 82 [(errors.code) = 400];

  // JOB_TRIGGER_NOT_FOUND 触发器不存在，映射 HTTP 404。
  JOB_TRIGGER_NOT_FOUND = 90 [(errors.code) = 404];
  // JOB_TRIGGER_NAME_EXISTS 触发器名称已被占用，映射 HTTP 409。
  JOB_TRIGGER_NAME_EXISTS = 91 [(errors.code) = 409];
  // JOB_TRIGGER_INVALID 触发器不合法（匹配条件为空、参数取值、类型不可改等），映射 HTTP 400。
  JOB_TRIGGER_INVALID = 92 [(errors.code) = 400];
  // JOB_TRIGGER_UNAUTHORIZED 开放触发接口的调用令牌或签名无效，映射 HTTP 401。
  JOB_TRIGGER_UNAUTHORIZED = 93 [(errors.code) = 401];
  // JOB_TRIGGER_DISABLED 触发器已停用，映射 HTTP 409。
  JOB_TRIGGER_DISABLED = 94 [(errors.code) = 409];
}
