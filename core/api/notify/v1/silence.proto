syntax = "proto3";

package notify.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "system/v1/annotations.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/api/notify/v1;v1";

// NotifySilenceService 通知静默（免打扰）管理服务：router 处理事件的第 2 步——
// 事件命中任一启用静默规则（event_pattern 匹配 + severity ≤ severity_max +
// 当前时间落时间窗，无窗即全程）即置 suppressed，不再生成通知任务。
// 多条静默规则可重叠，任一命中即抑制。更新语义与路由一致：规则字段经 spec
// 整组替换，enabled 独立启停。
service NotifySilenceService {
  // CreateSilence 创建静默规则。
  rpc CreateSilence(CreateSilenceRequest) returns (CreateSilenceResponse) {
    option (google.api.http) = {
      post: "/api/v1/notify/silence"
      body: "*"
    };
    option (system.v1.title) = "创建静默规则";
  }
  // UpdateSilence 更新静默规则：spec 整组替换规则字段，enabled 独立启停，
  // 至少传其一；biz_id 不可改。
  rpc UpdateSilence(UpdateSilenceRequest) returns (UpdateSilenceResponse) {
    option (google.api.http) = {
      put: "/api/v1/notify/silence/{id}"
      body: "*"
    };
    option (system.v1.title) = "更新静默规则";
  }
  // DeleteSilence 删除静默规则（软删）。
  rpc DeleteSilence(DeleteSilenceRequest) returns (DeleteSilenceResponse) {
    option (google.api.http) = {
      delete: "/api/v1/notify/silence/{id}"
    };
    option (system.v1.title) = "删除静默规则";
  }
  // GetSilence 查询静默规则详情。
  rpc GetSilence(GetSilenceRequest) returns (GetSilenceResponse) {
    option (google.api.http) = {
      get: "/api/v1/notify/silence/{id}"
    };
    option (system.v1.title) = "查询静默规则";
  }
  // ListSilences 分页查询静默规则，page_size 上限 100。
  rpc ListSilences(ListSilencesRequest) returns (ListSilencesResponse) {
    option (google.api.http) = {
      get: "/api/v1/notify/silence"
    };
    option (system.v1.title) = "查询静默规则列表";
  }
}

// SilenceWindow 免打扰时间窗：支持跨午夜（如 22:00→08:00 覆盖夜间）；
// 时区缺省 UTC。
message SilenceWindow {
  // start 窗口起点，24 小时制 HH:MM。
  string start = 1 [(buf.validate.field).string = {
    min_len: 5
    max_len: 5
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
  }];
  // end 窗口终点，24 小时制 HH:MM；与 start 相同表示零长窗口，非法。
  string end = 2 [(buf.validate.field).string = {
    min_len: 5
    max_len: 5
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
  }];
  // tz IANA 时区名（如 Asia/Shanghai），可选；缺省 UTC，由 core 校验有效性。
  optional string tz = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// SilenceSpec 静默规则载荷：一组互为整体的匹配决策（创建/更新共用）；
// severity_max 可选，缺省 2（warning 及以下）；time_window 可选，缺省全程。
message SilenceSpec {
  // event_pattern 事件匹配模式：精确 / 前缀通配（'monitor.alert.*'）/ 全匹配（'*'），
  // 与路由同式。
  string event_pattern = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^(\\*|[a-z0-9][a-z0-9._-]{0,127}|[a-z0-9][a-z0-9._-]{0,125}\\.\\*)$"
  }];
  // severity_max 严重级上限（1 info / 2 warning / 3 critical / 4 fatal），可选。
  optional int32 severity_max = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 4
  }];
  // time_window 免打扰时间窗，可选；缺省全程静默（更新时整组替换语义下
  // 不传即清除窗口）。
  optional SilenceWindow time_window = 3;
  // name 可读名称，可选（≤64；控制台列表展示）。
  optional string name = 4 [(buf.validate.field).string.max_len = 64];
  // description 说明，可选（≤255）。
  optional string description = 5 [(buf.validate.field).string.max_len = 255];
}

// NotifySilence 静默规则实体。
message NotifySilence {
  // id 静默规则唯一标识（UUIDv7）。
  string id = 1;
  // biz_id 业务租户标识；静默匹配按 biz 隔离。
  string biz_id = 2;
  // event_pattern 事件匹配模式。
  string event_pattern = 3;
  // severity_max 严重级上限，该级及以下的事件才可被静默。
  int32 severity_max = 4;
  // time_window 免打扰时间窗；未设置表示全程静默。
  optional SilenceWindow time_window = 5;
  // enabled 启用状态；停用后不参与匹配（≤10s 生效）。
  bool enabled = 6;
  // create_time 创建时间。
  google.protobuf.Timestamp create_time = 7;
  // update_time 更新时间。
  google.protobuf.Timestamp update_time = 8;
  // name 可读名称（空 = 未命名）。
  string name = 9;
  // description 说明。
  string description = 10;
}

// CreateSilenceRequest 创建静默规则请求。
message CreateSilenceRequest {
  // biz_id 业务租户标识，可选；未指定默认 default。
  optional string biz_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9_-]{1,64}$"
  }];
  // spec 静默规则。
  SilenceSpec spec = 2;
  // enabled 初始启用状态，可选；未指定默认启用。
  optional bool enabled = 3;
}

// CreateSilenceResponse 创建静默规则响应。
message CreateSilenceResponse {
  // silence 已创建的静默规则实体。
  NotifySilence silence = 1;
}

// UpdateSilenceRequest 更新静默规则请求：spec 与 enabled 至少传其一。
message UpdateSilenceRequest {
  option (buf.validate.message).cel = {
    id: "notify.silence.update.non_empty"
    message: "at least one of spec or enabled must be provided"
    expression: "has(this.spec) || has(this.enabled)"
  };

  // id 静默规则唯一标识，取自路径参数。
  string id = 1 [(buf.validate.field).string.uuid = true];
  // spec 新静默规则，整组替换规则字段。
  optional SilenceSpec spec = 2;
  // enabled 新启用状态。
  optional bool enabled = 3;
}

// UpdateSilenceResponse 更新静默规则响应：返回更新后的规则。
message UpdateSilenceResponse {
  // silence 更新后的静默规则。
  NotifySilence silence = 1;
}

// DeleteSilenceRequest 删除静默规则请求。
message DeleteSilenceRequest {
  // id 静默规则唯一标识，取自路径参数。
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteSilenceResponse 删除静默规则响应。
message DeleteSilenceResponse {}

// GetSilenceRequest 查询静默规则请求。
message GetSilenceRequest {
  // id 静默规则唯一标识，取自路径参数。
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetSilenceResponse 查询静默规则响应。
message GetSilenceResponse {
  // silence 静默规则实体。
  NotifySilence silence = 1;
}

// ListSilencesRequest 分页查询静默规则请求。
message ListSilencesRequest {
  // page 页码，从 1 开始。
  int64 page = 1 [(buf.validate.field).int64.gte = 1];
  // page_size 每页数量，1-100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // keyword 关键字，可选；模糊匹配 name / event_pattern。
  optional string keyword = 3 [(buf.validate.field).string.max_len = 64];
  // enabled 启用状态过滤，可选。
  optional bool enabled = 4;
  // biz_id 业务命名空间过滤，可选；biz 受限用户必填（NOTIFY_BIZ_REQUIRED）。
  optional string biz_id = 5 [(buf.validate.field).string = {pattern: "^[a-z0-9_-]{1,64}$"}];
}

// ListSilencesResponse 分页查询静默规则响应。
message ListSilencesResponse {
  // items 当前页数据。
  repeated NotifySilence items = 1;
  // total 总数。
  int64 total = 2;
}
