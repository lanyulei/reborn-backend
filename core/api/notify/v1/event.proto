syntax = "proto3";

package notify.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "notify/v1/delivery_log.proto";
import "notify/v1/dispatch.proto";
import "system/v1/annotations.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/api/notify/v1;v1";

// NotifyEventService 通知事件查询服务：只读运行表 notify_event（管道写 /
// core 读，设计 §5.2）。事件是 append-only 运行数据——先落库后应答（§7.1
// 不丢闭环），无管理写路径；本服务仅提供控制台排障检索。
service NotifyEventService {
  // ListEvents 分页查询事件，page_size 上限 100；按落库时间倒序。
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {
      get: "/api/v1/notify/event"
    };
    option (system.v1.title) = "查询通知事件列表";
  }
  // GetEvent 事件下钻：事件 + 其全部发送任务（≤100）+ 每个任务最近一次投递明细，
  // 一次调用覆盖控制台"这条通知到底发到哪了"的排障路径。
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {
    option (google.api.http) = {
      get: "/api/v1/notify/event/{id}"
    };
    option (system.v1.title) = "查询通知事件详情";
  }
  // ReplayEvent 事件级重发：以原事件的类型/级别/标题/载荷/收件/分组重新直插一条
  // source=internal 的新事件（新 id，不带 dedup_key——刻意再投），走完整路由链路；
  // 用于路由/模板修复后整条重发（死信重放只重发单个失败任务）。
  rpc ReplayEvent(ReplayEventRequest) returns (ReplayEventResponse) {
    option (google.api.http) = {
      post: "/api/v1/notify/event/{id}:replay"
      body: "*"
    };
    option (system.v1.title) = "重发通知事件";
  }
}

// NotifyEvent 事件实体（notify_event 一行的排障视图）。
message NotifyEvent {
  // id 事件唯一标识（UUIDv7）。
  string id = 1;
  // biz_id 业务租户标识。
  string biz_id = 2;
  // event_type 事件类型：如 monitor.alert.firing / permission.change。
  string event_type = 3;
  // severity 严重级：1 info / 2 warning / 3 critical / 4 fatal。
  int32 severity = 4;
  // title 事件标题。
  string title = 5;
  // payload JSON 载荷；未设置表示无载荷。
  google.protobuf.Struct payload = 6;
  // dedup_key 重复指纹（幂等去重用）；未设置表示无。
  string dedup_key = 7;
  // group_key 聚合分组键；未设置表示不聚合。
  string group_key = 8;
  // recipients 显式收件列表；空=走路由解析。
  repeated string recipients = 9;
  // source 事件来源：api（生产者经 ingress）/ internal（core 同事务直插）。
  string source = 10;
  // status 路由状态：1 received / 2 routed / 3 suppressed（静默命中）/ 4 failed（无匹配路由）。
  int32 status = 11;
  // publish_state 交付状态：0 pending（待 router 领取）/ 1 published（已交付路由
  // 处理，与事件终态同事务翻转；NATS 骨干下为已发布）。
  int32 publish_state = 12;
  // publish_attempts 路由瞬时错误重试次数（如订阅者查询超时；失败退避累加）。
  int32 publish_attempts = 13;
  // next_publish_time 下次领取/发布时间（退避后）。
  google.protobuf.Timestamp next_publish_time = 14;
  // create_time 落库时间（分区键）。
  google.protobuf.Timestamp create_time = 15;
}

// ListEventsRequest 分页查询事件请求：biz/event_type/时间/状态四维过滤
//（设计 §6.1），event_type 为精确匹配。
message ListEventsRequest {
  option (buf.validate.message).cel = {
    id: "notify.event.list.time_range"
    message: "createTimeStart must be <= createTimeEnd"
    expression: "!has(this.create_time_start) || !has(this.create_time_end) || this.create_time_start <= this.create_time_end"
  };

  // page 页码，从 1 开始。
  int64 page = 1 [(buf.validate.field).int64.gte = 1];
  // page_size 每页数量，1-100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // biz_id 业务租户标识过滤，可选；精确匹配。
  optional string biz_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9_-]{1,64}$"
  }];
  // event_type 事件类型过滤，可选；精确匹配。
  optional string event_type = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
  }];
  // status 路由状态过滤，可选：1 received / 2 routed / 3 suppressed / 4 failed。
  optional int32 status = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 4
  }];
  // 时间窗口：create_time_start 缺省 = (create_time_end 或当前时间) 往前 7 天；
  // 两者跨度上限 90 天（400 NOTIFY_TIME_RANGE_INVALID）。分区表按时间裁剪，无界
  // 查询会扫全部分区。
  // create_time_start 落库时间下界（含），可选。
  optional google.protobuf.Timestamp create_time_start = 6;
  // create_time_end 落库时间上界（含），可选。
  optional google.protobuf.Timestamp create_time_end = 7;
  // severity 严重级精确过滤，可选（1-4）。
  optional int32 severity = 8 [(buf.validate.field).int32 = {
    gte: 1
    lte: 4
  }];
  // source 来源过滤，可选：api（管道接入）/ internal（core 直插）。
  optional string source = 9 [(buf.validate.field).string = {in: ["api", "internal"]}];
  // keyword 标题关键字，可选；模糊匹配 title。
  optional string keyword = 10 [(buf.validate.field).string.max_len = 64];
  // group_key 分组键精确过滤，可选（聚合排障）。
  optional string group_key = 11 [(buf.validate.field).string.max_len = 128];
}

// ListEventsResponse 分页查询事件响应。
message ListEventsResponse {
  // items 当前页数据。
  repeated NotifyEvent items = 1;
  // total 总数。
  int64 total = 2;
}

// GetEventRequest 事件详情请求。
message GetEventRequest {
  // id 事件 ID。
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetEventResponse 事件详情响应：事件 + 发送任务 + 每个任务最近一次投递明细。
message GetEventResponse {
  // event 事件。
  NotifyEvent event = 1;
  // dispatches 该事件生成的发送任务（按生成时间倒序，最多 100 条）。
  repeated NotifyDispatch dispatches = 2;
  // latest_logs 每个发送任务最近一次投递明细（按 dispatch_id 对应；无尝试的任务无条目）。
  repeated NotifyDeliveryLog latest_logs = 3;
}

// ReplayEventRequest 事件重发请求。
message ReplayEventRequest {
  // id 源事件 ID。
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ReplayEventResponse 事件重发响应：新落库的事件。
message ReplayEventResponse {
  // event 新事件（source=internal，新 id）。
  NotifyEvent event = 1;
}
