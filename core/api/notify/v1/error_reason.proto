syntax = "proto3";

package notify.v1;

import "errors/errors.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/api/notify/v1;v1";

// ErrorReason 是通知域（notify）的业务错误码枚举，由 protoc-gen-go-errors
// 生成带 code 的错误构造器。枚举值沿用 Kratos 错误码惯例（域前缀而非枚举名
// 前缀），故豁免 ENUM_VALUE_PREFIX（见 buf.yaml ignore_only）。
enum ErrorReason {
  option (errors.default_code) = 500;
  // NOTIFY_UNSPECIFIED 未指定的通知错误。
  NOTIFY_UNSPECIFIED = 0;
  // NOTIFY_CHANNEL_NOT_FOUND 目标渠道不存在，映射 HTTP 404。
  NOTIFY_CHANNEL_NOT_FOUND = 1 [(errors.code) = 404];
  // NOTIFY_CHANNEL_NAME_EXISTS 同 biz 内渠道名已被占用（未删除行），映射 HTTP 409。
  NOTIFY_CHANNEL_NAME_EXISTS = 2 [(errors.code) = 409];
  // NOTIFY_CHANNEL_CONFIG_INVALID 渠道配置不合法（type 与 config 结构不匹配、
  // 该类型必需的 secret 缺失），映射 HTTP 400。
  NOTIFY_CHANNEL_CONFIG_INVALID = 3 [(errors.code) = 400];
  // NOTIFY_SECRET_UNAVAILABLE 渠道凭据加密主密钥未配置（KRATOS_NOTIFY_MASTER_KEY），
  // 无法安全落库带 secret 的渠道，映射 HTTP 500。
  NOTIFY_SECRET_UNAVAILABLE = 4 [(errors.code) = 500];
  // NOTIFY_TEMPLATE_NOT_FOUND 目标模板不存在，映射 HTTP 404。
  NOTIFY_TEMPLATE_NOT_FOUND = 5 [(errors.code) = 404];
  // NOTIFY_TEMPLATE_SPEC_EXISTS 同 biz 内 (event_type, channel_type) 组合的
  // 模板已存在（未删除行），映射 HTTP 409。
  NOTIFY_TEMPLATE_SPEC_EXISTS = 6 [(errors.code) = 409];
  // NOTIFY_TEMPLATE_INVALID 模板不合法（Go template 语法错误、引用了白名单外
  // 的渲染变量、或 spec 值非法），映射 HTTP 400。
  NOTIFY_TEMPLATE_INVALID = 7 [(errors.code) = 400];
  // NOTIFY_ROUTE_NOT_FOUND 目标路由不存在，映射 HTTP 404。
  NOTIFY_ROUTE_NOT_FOUND = 8 [(errors.code) = 404];
  // NOTIFY_ROUTE_INVALID 路由不合法（event_pattern/severity/priority/聚合参数
  // 越界、收件策略为空、引用了不存在或跨 biz 的渠道），映射 HTTP 400。
  NOTIFY_ROUTE_INVALID = 9 [(errors.code) = 400];
  // NOTIFY_SILENCE_NOT_FOUND 目标静默规则不存在，映射 HTTP 404。
  NOTIFY_SILENCE_NOT_FOUND = 10 [(errors.code) = 404];
  // NOTIFY_SILENCE_INVALID 静默规则不合法（event_pattern/severity_max 越界、
  // 时间窗格式错误或未知时区），映射 HTTP 400。
  NOTIFY_SILENCE_INVALID = 11 [(errors.code) = 400];
  // NOTIFY_SUBSCRIPTION_NOT_FOUND 目标订阅不存在，映射 HTTP 404。
  NOTIFY_SUBSCRIPTION_NOT_FOUND = 12 [(errors.code) = 404];
  // NOTIFY_SUBSCRIPTION_INVALID 订阅不合法（event_pattern 越界、渠道偏好
  // 类型不可订阅或取值非法），映射 HTTP 400。
  NOTIFY_SUBSCRIPTION_INVALID = 13 [(errors.code) = 400];
  // NOTIFY_SUBSCRIPTION_FORBIDDEN 非管理员代管他人订阅（订阅仅本人或
  // admin 代管），映射 HTTP 403。
  NOTIFY_SUBSCRIPTION_FORBIDDEN = 14 [(errors.code) = 403];
  // NOTIFY_PRODUCER_NOT_FOUND 目标生产者不存在，映射 HTTP 404。
  NOTIFY_PRODUCER_NOT_FOUND = 15 [(errors.code) = 404];
  // NOTIFY_PRODUCER_NAME_EXISTS 同 biz 内生产者名已被占用（未删除行），
  // 映射 HTTP 409。
  NOTIFY_PRODUCER_NAME_EXISTS = 16 [(errors.code) = 409];
  // NOTIFY_PRODUCER_INVALID 生产者不合法（名称为空、白名单条目非事件模式、
  // 过期时间不在未来），映射 HTTP 400。
  NOTIFY_PRODUCER_INVALID = 17 [(errors.code) = 400];
  // NOTIFY_DLQ_NOT_FOUND 目标死信不存在，映射 HTTP 404。
  NOTIFY_DLQ_NOT_FOUND = 18 [(errors.code) = 404];
  // NOTIFY_DLQ_INVALID_STATE 死信状态不满足重放条件（仅 none 可标记重放：
  // pending 已在重放队列、replayed 已重放完成），映射 HTTP 409。
  NOTIFY_DLQ_INVALID_STATE = 19 [(errors.code) = 409];
  // NOTIFY_CHANNEL_DISABLED 目标渠道已停用（停用实例被路由跳过，连通性
  // 测试无意义），映射 HTTP 409。
  NOTIFY_CHANNEL_DISABLED = 20 [(errors.code) = 409];
  // NOTIFY_EVENT_INVALID 业务事件直插（NotificationWriter，内部写路径，
  // 无独立 HTTP 端点）入参不合法：event_type 非小写点分事件名、severity
  // 越界、title 缺失或超限、payload 超 32KB 等；错误经调用方业务端点
  // 透传为 400。
  NOTIFY_EVENT_INVALID = 21 [(errors.code) = 400];
  // NOTIFY_CHANNEL_IN_USE 渠道仍被未删除路由引用，拒绝删除（先从路由解绑），
  // 映射 HTTP 409；避免路由携带悬挂的 channel_id 被管道静默跳过。
  NOTIFY_CHANNEL_IN_USE = 22 [(errors.code) = 409];
  // NOTIFY_BIZ_FORBIDDEN 目标 biz 不在操作者可管理范围（角色 biz_scope），映射 HTTP 403。
  NOTIFY_BIZ_FORBIDDEN = 23 [(errors.code) = 403];
  // NOTIFY_BIZ_REQUIRED biz 受限用户的列表查询必须携带 biz 过滤（渠道/模板/路由/
  // 静默/生产者/事件带 biz_id；任务/明细/死信带 channel_id），映射 HTTP 400。
  NOTIFY_BIZ_REQUIRED = 24 [(errors.code) = 400];
  // NOTIFY_TEST_TOO_FREQUENT 同一渠道连通性测试过于频繁（测试事件真实投递，
  // 按渠道 10s 冷却），映射 HTTP 429。
  NOTIFY_TEST_TOO_FREQUENT = 25 [(errors.code) = 429];
  // NOTIFY_TIME_RANGE_INVALID 运行表列表时间跨度超过 90 天（分区表按时间裁剪，
  // 更早的数据请分段查询），映射 HTTP 400。
  NOTIFY_TIME_RANGE_INVALID = 26 [(errors.code) = 400];
  // NOTIFY_EVENT_NOT_FOUND 目标事件不存在（或已按保留期清理），映射 HTTP 404。
  NOTIFY_EVENT_NOT_FOUND = 27 [(errors.code) = 404];
  // NOTIFY_DISPATCH_NOT_FOUND 目标发送任务不存在，映射 HTTP 404。
  NOTIFY_DISPATCH_NOT_FOUND = 28 [(errors.code) = 404];
}
