  // document_id 重建单篇文档。
  optional string document_id = 2 [(buf.validate.field).string.uuid = true];
}

// RebuildIndexResponse 重建索引响应。
message RebuildIndexResponse {
  // queued 已排队的文档数。
  int32 queued = 1;
}

// SearchLog 检索日志。
message SearchLog {
  // id 记录标识。
  string id = 1;
  // user_id 用户。
  string user_id = 2;
  // user_name 用户显示名。
  string user_name = 3;
  // source 来源：web / assistant / related。
  string source = 4;
  // query 检索词。
  string query = 5;
  // hit_count 命中数。
  int32 hit_count = 6;
  // degraded 是否降级。
  bool degraded = 7;
  // duration_ms 耗时。
  int64 duration_ms = 8;
  // feedback 反馈：0 无 / 1 有用 / 2 没用。
  int32 feedback = 9;
  // create_time 时间。
  google.protobuf.Timestamp create_time = 10;
}

// ListSearchLogsRequest 查询检索日志请求。
message ListSearchLogsRequest {
  // page 页码。
  int64 page = 1 [(buf.validate.field).int64.gte = 1];
  // page_size 每页数量。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // source 来源过滤。
  string source = 3 [(buf.validate.field).string.max_len = 16];
  // no_result 只看无结果。
  bool no_result = 4;
  // keyword 检索词模糊匹配。
  string keyword = 5 [(buf.validate.field).string.max_len = 128];
}

// ListSearchLogsResponse 查询检索日志响应。
message ListSearchLogsResponse {
  // items 当前页。
  repeated SearchLog items = 1;
  // total 总数。
  int64 total = 2;
}

// GetStatsRequest 统计请求。
message GetStatsRequest {
  // days 统计最近 N 天的检索，1-90；缺省 30。
  int32 days = 1 [(buf.validate.field).int32 = {gte: 0, lte: 90}];
}

// GetStatsResponse 统计响应。
message GetStatsResponse {
  // space_count 空间数。
  int64 space_count = 1;
  // document_count 已发布文档数。
  int64 document_count = 2;
  // draft_count 草稿数。
  int64 draft_count = 3;
  // chunk_count 分块数。
  int64 chunk_count = 4;
  // review_overdue_count 超期未复审文档数。
  int64 review_overdue_count = 5;
  // pending_review_count 待审核文档数。
  int64 pending_review_count = 6;
  // search_count 期间检索次数。
  int64 search_count = 7;
  // no_result_count 期间无结果次数。
  int64 no_result_count = 8;
  // helpful_count 期间「有用」反馈数。
  int64 helpful_count = 9;
  // unhelpful_count 期间「没用」反馈数。
  int64 unhelpful_count = 10;
  // top_queries 期间无结果的高频检索词（知识缺口）。
  repeated QueryCount top_queries = 11;
}

// QueryCount 检索词计数。
message QueryCount {
  // query 检索词。
