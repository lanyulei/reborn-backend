  // notify_recovery 告警恢复时是否通知。
  bool notify_recovery = 18;
  // repeat_interval_m 重复通知间隔分钟：0 表示不重复，否则 5-10080（告警持续期间每隔该时长再通知一次）。
  int32 repeat_interval_m = 19 [(buf.validate.field).cel = {
    id: "monitor.rule.repeat_interval"
