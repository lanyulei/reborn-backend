  repeated string datasource_ids = 7 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // queries 查询与级别，1-4 条，级别互不相同（多档阈值：每个级别一条查询）。
  repeated RuleQuery queries = 8 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 4
  }];
  // level_inhibit 级别抑制：同一序列同时命中多档时只保留最高级别的告警；关闭时各级别各自产生事件。
