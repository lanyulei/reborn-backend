// BatchRulesRequest 批量操作规则请求。action 决定使用哪些参数字段，其余字段须留空
// （400 MONITOR_RULE_BATCH_INVALID）。
message BatchRulesRequest {
  // ids 规则 ID，1-200 个。
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 200
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // action 操作：enable 启用 / disable 停用 / move 移动到 group_id / set_severity 把级别改为 severity
  // （仅适用于只有一条查询的规则）/ set_timing 修改 eval_interval_s、for_s、recover_s 中给出的项 /
  // add_labels 添加或覆盖附加标签 labels / remove_labels 移除附加标签 label_names /
  // set_notify 修改通知配置（notify、notify_recovery、repeat_interval_m、max_notify 中给出的项）/ delete 删除 /
  // set_escalation 把升级策略改为 escalation_id（不传 = 取消升级策略）。
  string action = 2 [(buf.validate.field).string = {
    in: [
      "enable",
      "disable",
      "move",
      "set_severity",
      "set_timing",
      "add_labels",
      "remove_labels",
      "set_notify",
      "delete",
      "set_escalation"
    ]
  }];
  // group_id 目标分组，action=move 时必填；须对该分组「可管理」。
  optional string group_id = 3 [(buf.validate.field).string.uuid = true];
  // severity 目标级别，action=set_severity 时必填：1=提示 2=警告 3=严重 4=致命。
  optional int32 severity = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 4
  }];
  // eval_interval_s 评估周期秒，15-3600；action=set_timing 时可选。
  optional int32 eval_interval_s = 5 [(buf.validate.field).int32 = {
    gte: 15
    lte: 3600
  }];
  // for_s 持续时长秒，0-86400；action=set_timing 时可选。
  optional int32 for_s = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 86400
  }];
  // recover_s 恢复留观时长秒，0-86400；action=set_timing 时可选。
  optional int32 recover_s = 7 [(buf.validate.field).int32 = {
    gte: 0
    lte: 86400
  }];
  // labels 要添加或覆盖的附加标签，action=add_labels 时必填，至多 20 个；合并后每条规则仍不得超过 20 个。
  map<string, string> labels = 8 [(buf.validate.field).map = {
    max_pairs: 20
    keys: {
      string: {
        max_len: 128
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
      }
    }
    values: {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  }];
  // label_names 要移除的附加标签名，action=remove_labels 时必填，至多 20 个。
  repeated string label_names = 9 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {
        max_len: 128
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
      }
    }
  }];
  // notify 通知对象（整体替换），action=set_notify 时可选。
  optional RuleNotify notify = 10;
  // notify_recovery 恢复时是否通知，action=set_notify 时可选。
  optional bool notify_recovery = 11;
  // repeat_interval_m 重复通知间隔分钟（0 或 5-10080），action=set_notify 时可选。
  optional int32 repeat_interval_m = 12 [(buf.validate.field).cel = {
    id: "monitor.rule.batch.repeat_interval"
    message: "repeat_interval_m must be 0 or between 5 and 10080"
    expression: "this == 0 || (this >= 5 && this <= 10080)"
  }];
  // max_notify 通知次数上限（0-1000，0 不限），action=set_notify 时可选。
  optional int32 max_notify = 13 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // escalation_id 升级策略，action=set_escalation 时使用：不传表示取消升级策略；策略须能被每条规则所在的分组引用。
  optional string escalation_id = 14 [(buf.validate.field).string.uuid = true];
}

// BatchRuleResult 批量操作中一条规则的结果。
message BatchRuleResult {
  // id 规则唯一标识。
  string id = 1;
  // name 规则名称（规则不存在时为空）。
  string name = 2;
  // ok 是否成功。
  bool ok = 3;
  // reason 失败的错误码（如 MONITOR_FORBIDDEN、MONITOR_RULE_NOT_FOUND）；成功时为空。
  string reason = 4;
  // message 失败原因说明；成功时为空。
  string message = 5;
}

// BatchRulesResponse 批量操作规则响应。
message BatchRulesResponse {
  // results 逐条结果，顺序与请求的 ids 一致。
  repeated BatchRuleResult results = 1;
  // succeeded 成功条数。
  int32 succeeded = 2;
  // failed 失败条数。
  int32 failed = 3;
}

// RuleVersion 规则的一个历史版本。
message RuleVersion {
  // rule_id 规则唯一标识。
  string rule_id = 1;
  // version 版本号。
  int32 version = 2;
  // action 产生该版本的操作：create 新建 / update 编辑 / enable 启用 / disable 停用 / move 移动分组 /
  // rollback 回滚 / import 导入 / delete 删除 / batch 批量操作。
  string action = 3;
  // summary 变更说明。
  string summary = 4;
  // operator_id 操作人。
  string operator_id = 5;
  // operator_name 操作人显示名。
  string operator_name = 6;
  // create_time 操作时间。
  google.protobuf.Timestamp create_time = 7;
  // spec 该版本保存后的规则内容；仅 GetRuleVersion 返回。
  RuleSpec spec = 8;
  // group_name 该版本所属分组当前的完整名称；仅 GetRuleVersion 返回。
  string group_name = 9;
}

// ListRuleVersionsRequest 查询规则变更历史请求。
message ListRuleVersionsRequest {
  // id 规则唯一标识。
  string id = 1 [(buf.validate.field).string.uuid = true];
  // page 页码，从 1 开始。
  int64 page = 2 [(buf.validate.field).int64.gte = 1];
  // page_size 每页数量，1-100。
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
}

// ListRuleVersionsResponse 查询规则变更历史响应。
message ListRuleVersionsResponse {
  // items 当前页数据（不含 spec）。
  repeated RuleVersion items = 1;
  // total 总数。
  int64 total = 2;
}

// GetRuleVersionRequest 查询规则历史版本请求。
message GetRuleVersionRequest {
  // id 规则唯一标识。
  string id = 1 [(buf.validate.field).string.uuid = true];
  // version 版本号。
  int32 version = 2 [(buf.validate.field).int32.gte = 1];
}

// GetRuleVersionResponse 查询规则历史版本响应。
message GetRuleVersionResponse {
  // version 该版本（含 spec）。
  RuleVersion version = 1;
}

// RollbackRuleRequest 回滚规则请求。
message RollbackRuleRequest {
  // id 规则唯一标识。
  string id = 1 [(buf.validate.field).string.uuid = true];
  // version 要回滚到的历史版本号。
  int32 version = 2 [(buf.validate.field).int32.gte = 1];
  // current_version 规则当前的版本号（乐观锁），须与当前一致。
  int32 current_version = 3 [(buf.validate.field).int32.gte = 1];
}

// RollbackRuleResponse 回滚规则响应。
message RollbackRuleResponse {
  // rule 回滚后的规则（版本号为新版本）。
  Rule rule = 1;
}

// ValidateRuleExprsRequest 校验规则表达式请求。
message ValidateRuleExprsRequest {
  // exprs 待校验的 PromQL，1-8 条，每条至多 8192 字符。
  repeated string exprs = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 8
    items: {
      string: {
        min_len: 1
        max_len: 8192
      }
    }
  }];
  // datasource_id 用于校验的数据源，可选；不传使用缺省数据源。
  optional string datasource_id = 2 [(buf.validate.field).string.uuid = true];
}

// RuleExprResult 一条表达式的校验结果。
message RuleExprResult {
  // expr 表达式原文。
  string expr = 1;
  // valid 语法是否合法。
  bool valid = 2;
  // error 不合法的原因；合法时为空。
  string error = 3;
}

// ValidateRuleExprsResponse 校验规则表达式响应。
message ValidateRuleExprsResponse {
  // results 逐条结果，顺序与请求一致。
  repeated RuleExprResult results = 1;
}

// ImportRulesOptions 导入规则的公共选项（预览与导入共用，两次请求须一致）。
message ImportRulesOptions {
  option (buf.validate.message).cel = {
    id: "monitor.rule.import.datasource_scope"
    message: "datasource_ids must have 1-20 items when datasource_scope is 1 and be empty when it is 2"
    expression: "this.datasource_scope == 1 ? size(this.datasource_ids) >= 1 : size(this.datasource_ids) == 0"
  };

  // content 导入内容原文，至多 1 MiB、500 条规则。两种格式自动识别（内容是带 `format` 键的 JSON 对象时按
  // 本系统的 JSON 格式处理，其余按 YAML）：
  //   - Prometheus / vmalert 告警规则 YAML（groups[].rules[]）：只导入告警规则（alert），记录规则
  //     （record）跳过并在结果中说明；数据源范围、通知对象、默认级别取自本消息的其余字段。
  //   - 本系统导出的 JSON（ExportRules format=json，`"format": "reborn.monitor.rules/v1"`）：规则的
  //     全部字段取自文件。文件里引用的数据源、通知用户、值班表、部门按 ID 判断：存在且可用（数据源、
  //     值班表须启用，用户须可用）则保留，否则丢弃并在预览的 warnings 里说明；指定的数据源全部被丢弃时改用
  //     本消息的 datasource_scope / datasource_ids。本消息的 notify 非空时覆盖文件里的通知对象。
  //     default_severity / severity_map 对 JSON 不起作用。目标分组恒为 group_id，是否启用由
  //     ImportRulesRequest.enabled 决定。
  string content = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 1048576
  }];
  // group_id 导入到的规则分组；须对该分组「可管理」。
  string group_id = 2 [(buf.validate.field).string.uuid = true];
  // datasource_scope 导入规则的数据源范围：1=指定数据源 2=全部启用的数据源。
  int32 datasource_scope = 3 [(buf.validate.field).int32 = {
    in: [
      1,
      2
    ]
  }];
  // datasource_ids 指定的数据源，范围为 1 时 1-20 个。
  repeated string datasource_ids = 4 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // default_severity 规则没有可识别的 severity 标签时采用的级别：1=提示 2=警告 3=严重 4=致命。
  int32 default_severity = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 4
  }];
  // notify 导入规则统一采用的通知对象，可选。
  RuleNotify notify = 6;
  // severity_map severity 标签取值 → 级别的对照表（仅 YAML），可选，至多 50 项：键为标签取值
  // （不区分大小写，1-64 字符），值为级别 1-4。未命中时退回内置对照（critical / warning / info / P1 等
  // 常见写法），再退回 default_severity。
  map<string, int32> severity_map = 7 [(buf.validate.field).map = {
    max_pairs: 50
    keys: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
    values: {
      int32: {
        gte: 1
        lte: 4
      }
    }
  }];
}

// ImportRuleItem 导入内容中的一条规则。
message ImportRuleItem {
  // index 在导入内容中的序号（从 0 起；YAML 跨组连续）。
  int32 index = 1;
  // source_group YAML 中所在的组名；JSON 为导出时所在分组的完整名称。
  string source_group = 2;
  // name 规则名称（YAML 的 alert 字段 / JSON 的 name）。
  string name = 3;
  // status 预览结论：new 可新建 / conflict 与分组内现有规则重名 / invalid 无法转换 / skipped 跳过（记录规则）。
  string status = 4;
  // spec 转换后的规则内容；status 为 invalid / skipped 时为空。
  RuleSpec spec = 5;
  // existing_rule_id 重名的现有规则；仅 status=conflict 时有值。
  string existing_rule_id = 6;
  // error 无法转换或跳过的原因。
  string error = 7;
  // warnings 转换时的提示（如无法识别的字段被忽略、级别取了缺省值）。
  repeated string warnings = 8;
}

// PreviewImportRulesRequest 预览导入告警规则请求。
message PreviewImportRulesRequest {
  // options 导入选项。
  ImportRulesOptions options = 1 [(buf.validate.field).required = true];
}

// PreviewImportRulesResponse 预览导入告警规则响应。
message PreviewImportRulesResponse {
  // items 逐条预览结果，至多 500 条（超出时请拆分文件）。
  repeated ImportRuleItem items = 1;
  // total 解析出的规则总数。
  int32 total = 2;
  // new_count 可新建的条数。
  int32 new_count = 3;
  // conflict_count 与现有规则重名的条数。
  int32 conflict_count = 4;
  // invalid_count 无法转换的条数。
  int32 invalid_count = 5;
  // skipped_count 跳过的条数。
  int32 skipped_count = 6;
}

// ImportRulesRequest 导入告警规则请求。
message ImportRulesRequest {
  // options 导入选项。
  ImportRulesOptions options = 1 [(buf.validate.field).required = true];
  // on_conflict 与分组内现有规则重名时的处理：skip 跳过 / overwrite 覆盖现有规则（生成新版本）/
  // rename 改名后新建（名称加序号）。
  string on_conflict = 2 [(buf.validate.field).string = {
    in: [
      "skip",
      "overwrite",
      "rename"
    ]
  }];
  // enabled 导入的规则是否立即启用；建议先停用导入、核对后再启用。
  bool enabled = 3;
}

// ImportRuleResult 一条规则的导入结果。
message ImportRuleResult {
  // index 在 YAML 中的序号（与预览一致）。
  int32 index = 1;
  // name 规则名称（改名时为新名称）。
  string name = 2;
  // action 处理结果：created 已新建 / updated 已覆盖 / skipped 已跳过 / failed 失败。
  string action = 3;
  // rule_id 新建或被覆盖的规则；跳过与失败时为空。
  string rule_id = 4;
  // error 跳过或失败的原因。
  string error = 5;
}

// ImportRulesResponse 导入告警规则响应。
message ImportRulesResponse {
  // results 逐条结果。
  repeated ImportRuleResult results = 1;
  // created 新建条数。
  int32 created = 2;
  // updated 覆盖条数。
  int32 updated = 3;
  // skipped 跳过条数。
  int32 skipped = 4;
  // failed 失败条数。
  int32 failed = 5;
}

// ExportRulesRequest 导出告警规则请求：ids 与 group_id 至少给一个；都给时取交集。
message ExportRulesRequest {
  option (buf.validate.message).cel = {
    id: "monitor.rule.export.non_empty"
    message: "at least one of ids or group_id must be provided"
    expression: "size(this.ids) > 0 || has(this.group_id)"
  };

  // ids 要导出的规则，至多 200 个，可选。
  repeated string ids = 1 [(buf.validate.field).repeated = {
    max_items: 200
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // group_id 导出该分组（含其全部下级）的规则，可选；至多导出 2000 条。
  optional string group_id = 2 [(buf.validate.field).string.uuid = true];
  // format 导出格式：yaml（缺省，留空同）= Prometheus / vmalert 告警规则 YAML；json = 本系统完整格式
  // （见 ExportRulesResponse.content）。
  string format = 3 [(buf.validate.field).string = {
    in: [
      "",
      "yaml",
      "json"
    ]
  }];
}

// ExportRulesResponse 导出告警规则响应。
message ExportRulesResponse {
  // content 导出内容。
  //   - yaml：Prometheus / vmalert 告警规则 YAML，每个分组一个 group，级别写入 severity 标签，多档阈值的
  //     规则按级别拆成多条；本系统特有的配置（生效时间、通知对象等）不在其中。
  //   - json：`{"format": "reborn.monitor.rules/v1", "export_time": "<RFC 3339>", "rules": [...]}`。
  //     rules 的每一项是一条规则的全部字段（字段名同 RuleSpec 的 proto 名，下划线风格），其中引用以
  //     ID + 名称表示：`group: {id, name}`、`datasources: [{id, name}]`、
  //     `notify: {users: [{id, name}], schedules: [{id, name}], depts: [{id, name}]}`。名称只供阅读，
  //     导入时按 ID 识别。
  string content = 1;
  // filename 建议的文件名（随格式为 .yaml / .json）。
  string filename = 2;
  // count 导出的规则数。
  int32 count = 3;
}

// EvalQueryDetail 一次评估中一条查询的执行情况。
message EvalQueryDetail {
  // index 查询在规则 queries 中的下标（从 0 起）。
  int32 index = 1;
  // severity 该查询的级别。
  int32 severity = 2;
  // series 查询返回的序列数。
  int32 series = 3;
  // truncated 序列数是否超过单次查询上限而被截断。
  bool truncated = 4;
  // error 查询错误；成功时为空。
  string error = 5;
}

// EvalPoint 一次评估中的一个异常点及其判定结论。
message EvalPoint {
  // fingerprint 序列指纹。
  string fingerprint = 1;
  // labels 事件标签。
  map<string, string> labels = 2;
  // severity 级别。
  int32 severity = 3;
  // value 查询到的值（文本形式，可能为 NaN / +Inf / -Inf）。
  string value = 4;
  // step 判定结论：pending 异常但未满持续时长 / fired 本次触发 / firing 持续告警中 /
  // muted_event 被屏蔽规则屏蔽，未产生事件 / muted_notify 已产生事件但通知被屏蔽 /
  // inhibited 被同序列更高级别抑制 / recovering 已不异常，留观中 / resolved 本次判为恢复 /
  // dropped 被条件丢弃，未产生事件 / out_of_scope 不在规则限定的资源范围内，未产生事件 /
  // inhibited_rule 已产生事件但被抑制规则抑制 / inhibited_topology 已产生事件但上游资源正在告警 /
  // muted_maintenance 已产生事件但关联资源处于维护态，通知被屏蔽。
  string step = 5;
  // alert_id 对应的告警事件，可空。
  string alert_id = 6;
  // mute_id 命中的屏蔽规则，可空。
  string mute_id = 7;
  // inhibit_alert_id 造成抑制的源告警事件（step 为 inhibited_rule / inhibited_topology 时），可空。
  string inhibit_alert_id = 8;
  // ci_id 关联到的 CMDB 资源，可空。
  string ci_id = 9;
}

// RuleEvalRecord 一次评估的判定记录。
message RuleEvalRecord {
  // id 记录唯一标识。
  string id = 1;
  // rule_id 规则唯一标识。
  string rule_id = 2;
  // datasource_id 数据源唯一标识。
  string datasource_id = 3;
  // datasource_name 数据源名称。
  string datasource_name = 4;
  // eval_time 评估时间。
  google.protobuf.Timestamp eval_time = 5;
  // duration_ms 评估耗时毫秒。
  int32 duration_ms = 6;
  // status 评估结果：1=正常 2=告警中 3=无数据 4=查询错误 5=不在生效时间。
  int32 status = 7;
  // error 错误信息；无错误时为空。
  string error = 8;
  // series 查询返回的序列总数。
  int32 series = 9;
  // anomalies 判为异常的序列数。
  int32 anomalies = 10;
  // recovered 判为恢复的序列数。
  int32 recovered = 11;
  // queries 每条查询的执行情况。
  repeated EvalQueryDetail queries = 12;
  // points 异常点明细，至多 50 条。
  repeated EvalPoint points = 13;
  // points_truncated 异常点是否超过 50 条而被截断。
  bool points_truncated = 14;
}

// ListRuleEvalRecordsRequest 查询规则判定记录请求。
message ListRuleEvalRecordsRequest {
  option (buf.validate.message).cel = {
    id: "monitor.rule.eval_record.time_range"
    message: "eval_time_start must be <= eval_time_end"
    expression: "!has(this.eval_time_start) || !has(this.eval_time_end) || this.eval_time_start <= this.eval_time_end"
  };

  // id 规则唯一标识。
  string id = 1 [(buf.validate.field).string.uuid = true];
  // page 页码，从 1 开始。
  int64 page = 2 [(buf.validate.field).int64.gte = 1];
  // page_size 每页数量，1-100。
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // datasource_id 数据源过滤，可选。
  optional string datasource_id = 4 [(buf.validate.field).string.uuid = true];
  // status 评估结果过滤，可选：1=正常 2=告警中 3=无数据 4=查询错误 5=不在生效时间。
  optional int32 status = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 5
  }];
  // eval_time_start 评估时间下界（含），可选；记录只保留 7 天。
  optional google.protobuf.Timestamp eval_time_start = 6;
  // eval_time_end 评估时间上界（含），可选。
  optional google.protobuf.Timestamp eval_time_end = 7;
}

// ListRuleEvalRecordsResponse 查询规则判定记录响应。
message ListRuleEvalRecordsResponse {
  // items 当前页数据。
  repeated RuleEvalRecord items = 1;
  // total 总数。
  int64 total = 2;
}

// MonitorTargetSchedule 可选的值班表。
message MonitorTargetSchedule {
  // id 值班表唯一标识。
  string id = 1;
  // name 值班表名称。
  string name = 2;
  // group_name 所属值班组名称。
  string group_name = 3;
}

// MonitorTargetDept 可选的部门。
message MonitorTargetDept {
  // id 部门唯一标识。
  string id = 1;
  // name 部门名称。
  string name = 2;
  // parent_id 上级部门；顶级部门为空。按它组装成树。
  string parent_id = 3;
}

// MonitorTargetUser 可选的用户（最小披露：不含手机号、邮箱）。
message MonitorTargetUser {
  // id 用户唯一标识。
  string id = 1;
  // username 登录名。
  string username = 2;
  // nickname 昵称，可能为空。
  string nickname = 3;
}

// ListMonitorTargetOptionsRequest 查询通知对象候选项请求。
message ListMonitorTargetOptionsRequest {
  // keyword 用户的登录名 / 昵称模糊匹配，可选；只影响 users。
  optional string keyword = 1 [(buf.validate.field).string.max_len = 64];
  // kinds 要返回的候选项种类：schedule / dept / user，可选；不传返回全部三种。输入框逐字搜索用户时
  // 只传 user，避免重复加载值班表与部门。
  repeated string kinds = 2 [(buf.validate.field).repeated = {
    max_items: 3
    unique: true
    items: {
      string: {
        in: [
          "schedule",
          "dept",
          "user"
        ]
      }
    }
  }];
}

// ListMonitorTargetOptionsResponse 查询通知对象候选项响应。未请求的种类为空数组。
message ListMonitorTargetOptionsResponse {
  // schedules 启用的值班表，按值班组、名称排序。
  repeated MonitorTargetSchedule schedules = 1;
  // depts 全部部门（平铺，上级在前）。
  repeated MonitorTargetDept depts = 2;
  // users 可用用户，至多 50 个；更多请用 keyword 缩小范围。
  repeated MonitorTargetUser users = 3;
}

// RuleTemplatePack 一个内置规则模板包。
message RuleTemplatePack {
  // code 模板包编码（如 node-exporter、mysql、redis、reborn-self）。
  string code = 1;
  // name 名称。
  string name = 2;
  // description 说明：适用对象、依赖的采集器（exporter）与指标。
  string description = 3;
  // category 类别：host 主机 / middleware 中间件 / database 数据库 / platform 本平台自监控。
  string category = 4;
  // rule_count 包内的规则条数。
  int32 rule_count = 5;
}

// ListRuleTemplatePacksRequest 查询内置规则模板请求。
message ListRuleTemplatePacksRequest {}

// ListRuleTemplatePacksResponse 查询内置规则模板响应。
message ListRuleTemplatePacksResponse {
  // items 全部模板包，按类别、名称排序。
  repeated RuleTemplatePack items = 1;
}

// RuleTemplateItem 模板包里的一条规则（摘要）。
message RuleTemplateItem {
  // name 规则名称。
  string name = 1;
  // expr PromQL 表达式。
  string expr = 2;
  // severity 级别：1=提示 2=警告 3=严重 4=致命。
  int32 severity = 3;
  // for_s 持续时长秒。
  int32 for_s = 4;
  // summary 规则说明（取自 annotations.summary / description）。
  string summary = 5;
}

// GetRuleTemplatePackRequest 查询内置规则模板详情请求。
message GetRuleTemplatePackRequest {
  // code 模板包编码。
  string code = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9][a-z0-9-]*$"
  }];
}

// GetRuleTemplatePackResponse 查询内置规则模板详情响应。
message GetRuleTemplatePackResponse {
  // pack 模板包。
  RuleTemplatePack pack = 1;
  // rules 包内的规则，顺序与 content 一致。
  repeated RuleTemplateItem rules = 2;
  // content 规则 YAML 原文（Prometheus / vmalert 告警规则格式），可原样作为 ImportRulesOptions.content 导入。
  string content = 3;
}

// SimulateRuleRequest 模拟触发告警规则请求。
message SimulateRuleRequest {
  // spec 规则内容（表单当前的内容，不要求已保存）。
  RuleSpec spec = 1 [(buf.validate.field).required = true];
  // datasource_id 在哪个数据源上执行查询；须在规则的数据源范围内（范围为全部数据源时任选一个已启用的）。
  string datasource_id = 2 [(buf.validate.field).string.uuid = true];
  // sample_labels 查询没有返回任何序列时用来合成事件的序列标签，可选，至多 30 个；规则的附加标签会自动合并进来。
  map<string, string> sample_labels = 3 [(buf.validate.field).map = {
    max_pairs: 30
    keys: {
      string: {
        max_len: 128
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
      }
    }
    values: {
      string: {max_len: 256}
    }
  }];
  // sample_value 合成事件的取值，可选，缺省 0。
  double sample_value = 4;
  // send 是否真实发送一条带 [TEST] 标记的通知（发给解析出的通知对象；不发给订阅者，不触发升级与事件动作）。
  // false = 干跑，只返回各阶段的结果。
  bool send = 5;
  // rule_id 正在编辑的规则，可选：判断抑制时把它自己的活跃告警排除在外。
  optional string rule_id = 6 [(buf.validate.field).string.uuid = true];
}

// SimulateStage 模拟触发的一个阶段的结论。
message SimulateStage {
  // stage 阶段，按处理顺序：query 查询 / effective 生效时间 / relabel 标签改写 / ci 关联资源与富化 /
  // drop 条件丢弃 / scope 资源范围 / level_inhibit 级别抑制 / inhibit 规则间抑制与拓扑抑制 / mute 屏蔽 /
  // notify 通知对象与订阅 / send 发送测试通知。
  string stage = 1;
  // status 结论：pass 通过 / warn 通过但有需要注意的情况 / block 事件在这一步被拦下（不会通知）/
  // error 这一步出错 / skip 未执行（前面已被拦下，或未配置）。
  string status = 2;
  // message 说明（中文，直接展示）。
  string message = 3;
}

// SimulateQueryResult 模拟触发中一条查询的执行结果。
message SimulateQueryResult {
  // index 查询在 spec.queries 中的下标（从 0 起）。
  int32 index = 1;
  // severity 该查询对应的级别。
  int32 severity = 2;
  // series 返回的序列数。
  int32 series = 3;
  // truncated 序列数超过上限被截断。
  bool truncated = 4;
  // error 查询出错的原文；成功为空。
  string error = 5;
  // duration_ms 查询耗时毫秒。
  int32 duration_ms = 6;
}

// SimulateEvent 模拟触发得到的一个事件及其在各阶段的去向。
message SimulateEvent {
  // labels 事件标签的最终内容（改写与富化之后）。
  map<string, string> labels = 1;
  // source_labels 改写之前的标签（序列标签 + 规则附加标签）。
  map<string, string> source_labels = 2;
  // severity 级别。
  int32 severity = 3;
  // value 取值；NaN、正负无穷按 JSON 字符串返回。
  double value = 4;
  // fingerprint 事件指纹。
  string fingerprint = 5;
  // annotations 渲染后的附加信息。
  map<string, string> annotations = 6;
  // outcome 去向：notify 会通知 / dropped 被条件丢弃 / out_of_scope 不在资源范围内 / level_inhibited 被同序列更高级别抑制 /
  // inhibited 被抑制规则或上游资源抑制 / muted_event 被屏蔽（不产生事件）/ muted_notify 被屏蔽（只屏蔽通知）/
  // maintenance 关联资源处于维护态（只屏蔽通知）。
  string outcome = 7;
  // reason 去向的说明（命中的抑制规则 / 屏蔽规则名称、丢弃表达式出错的原因等）。
  string reason = 8;
  // ci_status 关联资源的结论：matched 已关联 / disabled 规则关闭了关联 / no_label 事件没有用于关联的标签 /
  // not_found 没有对应的资源 / ambiguous 对应到多个资源 / unavailable 资源索引尚未就绪。
  string ci_status = 9;
  // ci 关联到的资源；未关联为空。
  NamedRef ci = 10;
  // inhibit_id 命中的抑制规则；拓扑抑制或未被抑制时为空。
  string inhibit_id = 11;
  // inhibit_alert_id 造成抑制的源告警事件。
  string inhibit_alert_id = 12;
  // mute_id 命中的屏蔽规则。
  string mute_id = 13;
}

// SimulateSubscription 模拟触发中命中的一条订阅。
message SimulateSubscription {
  // id 订阅规则唯一标识。
  string id = 1;
  // name 订阅规则名称。
  string name = 2;
  // recipients 这条订阅会通知到的接收方（已去掉规则通知对象里已有的人）。
  repeated NamedRef recipients = 3;
}

// SimulateEscalationLevel 模拟触发中升级策略一级的解析结果。
message SimulateEscalationLevel {
  // level 第几级。
  int32 level = 1;
  // after_m 告警持续多少分钟后升级到这一级。
  int32 after_m = 2;
  // trigger 触发条件：1=未认领 2=未恢复。
  int32 trigger = 3;
  // recipients 此刻解析出的通知对象。
  repeated NamedRef recipients = 4;
}

// SimulateRuleResponse 模拟触发告警规则响应。
message SimulateRuleResponse {
  // stages 各阶段的结论，按处理顺序；针对 events 里的第一个事件给出。
  repeated SimulateStage stages = 1;
  // queries 各查询的执行结果。
  repeated SimulateQueryResult queries = 2;
  // synthetic 查询没有结果，事件是用 sample_labels 合成的。
  bool synthetic = 3;
  // in_effect 此刻是否在规则的生效时间内（不在时评估引擎不会评估，后续阶段仍照常模拟）。
  bool in_effect = 4;
  // events 事件及其去向，至多 20 个（查询结果多于 20 条序列时只取前 20 条）。
  repeated SimulateEvent events = 5;
  // event_total 查询得到的事件总数。
  int32 event_total = 6;
  // recipients 规则通知对象解析出的用户；为空表示事件不带收件人，交由通知管理的路由与订阅决定。
  repeated NamedRef recipients = 7;
  // recipient_notes 解析通知对象时的说明（如「值班表 X 当前无人值班」「资源负责人不是系统用户」）。
  repeated string recipient_notes = 8;
  // subscriptions 命中的订阅规则，至多 50 条。
  repeated SimulateSubscription subscriptions = 9;
  // escalation 规则引用的升级策略各级此刻解析出的通知对象；未引用为空。
  repeated SimulateEscalationLevel escalation = 10;
  // route_matched 通知管理里是否有路由能匹配这条规则的告警事件（没有时通知不会被投递）。
  bool route_matched = 11;
  // sent 测试通知是否已写入通知管道（send=true 且事件的去向是 notify 时）。
  bool sent = 12;
  // notify_event_ids 测试通知写入通知管道的事件 ID，可据此到「通知管理 → 事件」查看投递情况。
  repeated string notify_event_ids = 13;
}

// MonitorTicketTemplateOption 可选的工单模板。
message MonitorTicketTemplateOption {
  // id 工单模板唯一标识。
  string id = 1;
  // name 模板名称。
  string name = 2;
  // category_name 所属服务目录名称。
  string category_name = 3;
}

// MonitorWorkflowOption 可选的流程定义。
message MonitorWorkflowOption {
  // key 流程标识。
  string key = 1;
  // name 流程名称。
  string name = 2;
}

// MonitorCIModelOption 可选的 CMDB 模型。
message MonitorCIModelOption {
  // code 模型编码。
  string code = 1;
  // name 模型名称。
  string name = 2;
}

// ListMonitorRuleOptionsRequest 查询规则配置候选项请求。
message ListMonitorRuleOptionsRequest {}

// ListMonitorRuleOptionsResponse 查询规则配置候选项响应。
message ListMonitorRuleOptionsResponse {
  // ticket_templates 启用的工单模板。
  repeated MonitorTicketTemplateOption ticket_templates = 1;
  // workflows 有已发布版本的流程定义。
  repeated MonitorWorkflowOption workflows = 2;
  // ci_models 启用的 CMDB 模型。
  repeated MonitorCIModelOption ci_models = 3;
  // ci_envs 资源上出现过的环境取值。
  repeated string ci_envs = 4;
  // ci_match_attrs 可用于关联的资源属性（部署配置里登记的，缺省只有 ip）。
  repeated string ci_match_attrs = 5;
  // ai_available 智能助手是否已配置模型密钥（未配置时 AI 摘要不会生成）。
  bool ai_available = 6;
}
