      }
    }
  }];
  // ci_match 关联 CMDB 资源的方式，可选；不传为全局缺省。
  RuleCIMatch ci_match = 22;
  // resource_scope 仅对指定资源生效，可选；不传为不限。
  RuleResourceScope resource_scope = 23;
  // relabel 事件标签改写步骤，至多 10 步，按顺序执行，可选。改写在计算事件指纹之前：改写规则变了，
