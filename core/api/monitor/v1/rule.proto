// CloneRuleRequest 克隆规则请求。
message CloneRuleRequest {
  // id 被克隆的规则。
  string id = 1 [(buf.validate.field).string.uuid = true];
  // name 新规则名称，可选；不传为「原名称 - 副本」（重名时自动加序号）。
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // group_id 新规则所属分组，可选；不传与原规则相同。须对该分组「可管理」。
  optional string group_id = 3 [(buf.validate.field).string.uuid = true];
}

// CloneRuleResponse 克隆规则响应。
message CloneRuleResponse {
  // rule 新建的规则（停用状态）。
  Rule rule = 1;
