    gte: 0
    lte: 86400
  }];
  // recover_s 恢复留观时长秒，0-86400：不再异常并持续该时长才判为恢复，0 表示立即恢复。
  int32 recover_s = 12 [(buf.validate.field).int32 = {
    gte: 0
    lte: 86400
  }];
  // nodata_keep_s 序列消失（查询不再返回该序列）后保持告警的秒数，0-86400；实际留观时长取它与
