syntax = "proto3";

package monitor.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "monitor/v1/common.proto";
import "system/v1/annotations.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/api/monitor/v1;v1";

// MonitorRuleService 告警规则：一条规则 = 一组 PromQL 查询（每条对应一个级别，查询有结果即异常）
// + 判定时间参数 + 生效时间 + 事件内容（附加标签 / 附加信息）+ 通知配置。评估引擎按评估周期在规则的
// 每个数据源上执行查询并驱动状态机产生告警事件。
// 权限：查看类接口要求对规则所在分组「只读」以上；新建 / 编辑 / 删除 / 启停 / 克隆 / 批量 / 导入 / 回滚
// 要求「可管理」（403 MONITOR_FORBIDDEN）。每次保存都会记一个版本，可查看历史并回滚。
service MonitorRuleService {
  // ListRules 分页查询告警规则（只返回当前用户数据范围内的规则），带每条规则的当前评估状态。
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/rule"};
    option (system.v1.title) = "查询告警规则";
  }
  // GetRule 查询规则详情（含在各数据源上的评估状态）。
  rpc GetRule(GetRuleRequest) returns (GetRuleResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/rule/{id}"};
    option (system.v1.title) = "查询告警规则详情";
  }
  // CreateRule 新建规则；同分组内名称重复返回 409 MONITOR_RULE_NAME_EXISTS。
  rpc CreateRule(CreateRuleRequest) returns (CreateRuleResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule"
      body: "*"
    };
    option (system.v1.title) = "新建告警规则";
  }
  // UpdateRule 编辑规则（整体替换）。version 不一致返回 409 MONITOR_VERSION_CONFLICT。
  // 更换分组要求对原分组与目标分组都「可管理」。
  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleResponse) {
    option (google.api.http) = {
      put: "/api/v1/monitor/rule/{id}"
      body: "*"
    };
    option (system.v1.title) = "编辑告警规则";
  }
  // DeleteRule 删除规则；其活跃告警随之关闭（不发恢复通知），历史告警保留。
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse) {
    option (google.api.http) = {delete: "/api/v1/monitor/rule/{id}"};
    option (system.v1.title) = "删除告警规则";
  }
  // ToggleRule 启用或停用规则；停用后其活跃告警随之关闭（不发恢复通知）。
  rpc ToggleRule(ToggleRuleRequest) returns (ToggleRuleResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule/{id}:toggle"
      body: "*"
    };
    option (system.v1.title) = "启停告警规则";
  }
  // CloneRule 克隆规则：复制全部配置生成一条新规则，新规则缺省停用。
  rpc CloneRule(CloneRuleRequest) returns (CloneRuleResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule/{id}:clone"
      body: "*"
    };
    option (system.v1.title) = "克隆告警规则";
  }
  // BatchRules 批量操作规则（至多 200 条）：启用 / 停用 / 移动分组 / 改级别 / 改时间参数 / 增删附加标签 /
  // 改通知配置 / 删除。逐条独立执行，部分失败不影响其余，结果逐条返回。
  rpc BatchRules(BatchRulesRequest) returns (BatchRulesResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule:batch"
      body: "*"
    };
    option (system.v1.title) = "批量操作告警规则";
  }
  // ListRuleVersions 分页查询规则的变更历史（按版本号倒序，不含快照内容）。
  rpc ListRuleVersions(ListRuleVersionsRequest) returns (ListRuleVersionsResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/rule/{id}/version"};
    option (system.v1.title) = "查询规则变更历史";
  }
  // GetRuleVersion 查询规则某个历史版本的完整内容（用于对比与回滚前确认）。
  rpc GetRuleVersion(GetRuleVersionRequest) returns (GetRuleVersionResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/rule/{id}/version/{version}"};
    option (system.v1.title) = "查询规则历史版本";
  }
  // RollbackRule 把规则回滚到某个历史版本的内容（生成一个新版本，不改写历史）。
  rpc RollbackRule(RollbackRuleRequest) returns (RollbackRuleResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule/{id}:rollback"
      body: "*"
    };
    option (system.v1.title) = "回滚告警规则";
  }
  // ValidateRuleExprs 校验 PromQL 语法（不保存）：逐条返回是否合法与错误原因。
  rpc ValidateRuleExprs(ValidateRuleExprsRequest) returns (ValidateRuleExprsResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule:validate"
      body: "*"
    };
    option (system.v1.title) = "校验规则表达式";
  }
  // PreviewImportRules 导入预览：解析 Prometheus / vmalert 告警规则 YAML 或本系统导出的 JSON
  // （自动识别，见 ImportRulesOptions.content），逐条给出转换结果、
  // 与现有规则的重名情况和无法转换的原因，不落库。
  rpc PreviewImportRules(PreviewImportRulesRequest) returns (PreviewImportRulesResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule:import-preview"
      body: "*"
    };
    option (system.v1.title) = "预览导入告警规则";
  }
  // ImportRules 导入 Prometheus / vmalert 告警规则 YAML 或本系统导出的 JSON 到指定分组；逐条独立执行并返回结果。
  rpc ImportRules(ImportRulesRequest) returns (ImportRulesResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule:import"
      body: "*"
    };
    option (system.v1.title) = "导入告警规则";
  }
  // ExportRules 导出规则：format=yaml（缺省）为 Prometheus / vmalert 告警规则 YAML（按分组成组，只含两者
  // 共有的字段）；format=json 为本系统的完整格式（规则全部字段，可原样再导入）。
  rpc ExportRules(ExportRulesRequest) returns (ExportRulesResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule:export"
      body: "*"
    };
    option (system.v1.title) = "导出告警规则";
  }
  // ListRuleEvalRecords 分页查询规则的判定记录（每次评估一条，保留 7 天，按评估时间倒序），
  // 用于排查「为什么告警 / 为什么没告警」。
  rpc ListRuleEvalRecords(ListRuleEvalRecordsRequest) returns (ListRuleEvalRecordsResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/rule/{id}/eval-record"};
    option (system.v1.title) = "查询规则判定记录";
  }
  // ListMonitorTargetOptions 通知对象的候选项（规则的通知对象、订阅的接收方选择器用）：启用的值班表、
  // 全部部门，以及按关键字匹配的可用用户（最小披露：只有 ID、登录名、昵称）。只读；随规则与订阅的
  // 新建 / 编辑权限开放，不要求值班管理或组织架构的权限。
  rpc ListMonitorTargetOptions(ListMonitorTargetOptionsRequest) returns (ListMonitorTargetOptionsResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/target-option"};
    option (system.v1.title) = "查询通知对象候选项";
  }
  // ListRuleTemplatePacks 列出内置的规则模板包（主机 node_exporter、常见中间件、本平台自监控等）。
  rpc ListRuleTemplatePacks(ListRuleTemplatePacksRequest) returns (ListRuleTemplatePacksResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/rule-template"};
    option (system.v1.title) = "查询内置规则模板";
  }
  // GetRuleTemplatePack 查看一个模板包的内容：逐条规则的摘要，以及可直接用于导入的规则 YAML 原文。
  // 一键导入 = 把返回的 content 作为 ImportRulesOptions.content，走 PreviewImportRules / ImportRules。
  rpc GetRuleTemplatePack(GetRuleTemplatePackRequest) returns (GetRuleTemplatePackResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/rule-template/{code}"};
    option (system.v1.title) = "查询内置规则模板详情";
  }
  // SimulateRule 模拟触发（不保存规则、不产生告警事件、不写时间线）：按给出的规则内容在指定数据源上执行查询，
  // 查询没有结果时用给出的样例标签合成一个事件，然后走与评估引擎相同的处理流程——生效时间 → 标签改写 →
  // 关联资源与富化 → 条件丢弃 → 资源范围 → 级别抑制 → 规则间抑制 / 拓扑抑制 → 屏蔽 → 通知对象与订阅解析，
  // 逐阶段返回结果。send=true 时另外真实发送一条标题带 [TEST] 的通知给解析出的通知对象。
  // 要求对规则所在分组「可管理」。
  rpc SimulateRule(SimulateRuleRequest) returns (SimulateRuleResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/rule:simulate"
      body: "*"
    };
    option (system.v1.title) = "模拟触发告警规则";
  }
  // ListMonitorRuleOptions 规则表单里第二、三期配置项的候选项：可用的工单模板、已发布的流程定义、CMDB 模型、
  // 环境与可用于关联的属性。只读、最小披露；随规则的新建 / 编辑权限开放，不要求工单、流程或资源管理的权限。
  rpc ListMonitorRuleOptions(ListMonitorRuleOptionsRequest) returns (ListMonitorRuleOptionsResponse) {
    option (google.api.http) = {get: "/api/v1/monitor/rule-option"};
    option (system.v1.title) = "查询规则配置候选项";
  }
}

// RuleQuery 规则的一条查询：PromQL 查询有结果即为异常，产生对应级别的告警。
message RuleQuery {
  // expr PromQL 表达式（需自带比较条件，如 cpu_usage > 90），至多 8192 字节、括号嵌套至多 64 层。
  // 兼容 MetricsQL 的函数与写法，但不支持在解析期展开的 WITH 模板（`WITH (...) expr`，
  // 请写出展开后的完整表达式）；ru() / ttf() 在一条表达式里合计至多调用 4 次。
  string expr = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];
  // severity 该查询对应的级别：1=提示 2=警告 3=严重 4=致命。
  int32 severity = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 4
  }];
}

// RuleNotify 规则的通知对象；三类取并集、去重后通知。全部为空时事件不带收件人，
// 交由通知管理里的路由与订阅决定发给谁。
message RuleNotify {
  // user_ids 直接通知的用户，至多 50 个。
  repeated string user_ids = 1 [(buf.validate.field).repeated = {
    max_items: 50
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // schedule_ids 值班表，至多 20 个；通知时取各值班表当前的值班人。
  repeated string schedule_ids = 2 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // dept_ids 部门，至多 20 个；通知各部门的负责人。
  repeated string dept_ids = 3 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // ci_owner 通知事件关联的 CMDB 资源的负责人（负责人是可用的系统用户时才有收件人）。
  bool ci_owner = 4;
}

// RuleCIMatch 事件如何关联 CMDB 资源。全部留空 = 全局缺省：先用 ident 标签对资源名称，找不到再用 instance
// 标签对资源的 ip 属性。标签值形如 host:port 时自动去掉端口；比较不区分大小写。对应到多个资源时不关联。
message RuleCIMatch {
  option (buf.validate.message).cel = {
    id: "monitor.rule.ci_match.label"
    message: "by is required when label is set; by and attr must be empty when label is empty; attr is only used when by is attr"
    expression: "this.label == '' ? (this.by == '' && this.attr == '') : (this.by == 'name' ? this.attr == '' : this.by == 'attr')"
  };

  // disabled 不关联资源（富化、维护态屏蔽、拓扑抑制、通知资源负责人随之不起作用）。
  bool disabled = 1;
  // label 用哪个事件标签去找资源；留空用全局缺省。
  string label = 2 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^([a-zA-Z_][a-zA-Z0-9_]*)?$"
  }];
  // by 标签值对应资源的什么：name 资源名称 / attr 资源的某个属性；label 非空时必填。
  string by = 3 [(buf.validate.field).string = {
    in: [
      "",
      "name",
      "attr"
    ]
  }];
  // attr by=attr 时比对的属性，留空为 ip；须是 ListMonitorRuleOptions 返回的可关联属性之一。
  string attr = 4 [(buf.validate.field).string.pattern = "^([a-z][a-z0-9_]{0,63})?$"];
  // model_codes 只在这些模型的资源里找，至多 20 个；留空不限。
  repeated string model_codes = 5 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {
        min_len: 1
        max_bytes: 64
      }
    }
  }];
  // enrich_tags 富化时写入事件的资源标签，至多 10 个：资源带有该标签时事件多一个 ci_tag_<标签>="true" 的标签
  // （标签里字母、数字、下划线以外的字符逐个写成 _x<十六进制码点>_，如「dmz zone」→ ci_tag_dmz_x20_zone）。
  // 资源的环境、负责人、模型恒以 ci_env / ci_owner / ci_model 写入事件标签。
  repeated string enrich_tags = 6 [(buf.validate.field).repeated = {
    max_items: 10
    unique: true
    items: {
      string: {
        min_len: 1
        max_bytes: 64
      }
    }
  }];
}

// RuleResourceScope 规则仅对指定资源生效：启用后事件必须关联到 CMDB 资源，且资源满足下面各项条件
// （各项之间是「并且」，留空 = 不限），否则不产生事件。
message RuleResourceScope {
  option (buf.validate.message).cel = {
    id: "monitor.rule.resource_scope.enabled"
    message: "model_codes, envs and tags must be empty when enabled is false"
    expression: "this.enabled || (size(this.model_codes) == 0 && size(this.envs) == 0 && size(this.tags) == 0)"
  };

  // enabled 是否启用。
  bool enabled = 1;
  // model_codes 资源的模型须是其中之一，至多 20 个。
  repeated string model_codes = 2 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {
        min_len: 1
        max_bytes: 64
      }
    }
  }];
  // envs 资源的环境须是其中之一，至多 20 个。
  repeated string envs = 3 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {
        min_len: 1
        max_bytes: 64
      }
    }
  }];
  // tags 资源须带有其中任意一个标签，至多 20 个。
  repeated string tags = 4 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {
        min_len: 1
        max_bytes: 64
      }
    }
  }];
}

// RuleRelabelStep 一步事件标签改写（语义同 Prometheus relabel_config 的同名动作），在计算事件指纹之前执行。
// 正则按 RE2 语法、整体匹配（等价于首尾加 ^ $）。
message RuleRelabelStep {
  // action 动作：
  //   - replace：把 source_labels 的取值用 separator 拼接，整体匹配 regex 时把 replacement（可用 $1、${name}
  //     引用捕获组）写入 target_label；结果为空则删除该标签；不匹配则不动。不给 source_labels 即写入常量。
  //   - labelmap：把名称匹配 regex 的标签，按 replacement 生成新名称后复制一份。
  //   - labeldrop：删除名称匹配 regex 的标签。
  //   - labelkeep：只保留名称匹配 regex 的标签。
  string action = 1 [(buf.validate.field).string = {
    in: [
      "replace",
      "labelmap",
      "labeldrop",
      "labelkeep"
    ]
  }];
  // source_labels 源标签，仅 replace 使用，至多 5 个。
  repeated string source_labels = 2 [(buf.validate.field).repeated = {
    max_items: 5
    items: {
      string: {
        max_len: 128
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
      }
    }
  }];
  // separator 拼接源标签取值的分隔符，仅 replace 使用；留空为 ";"。
  string separator = 3 [(buf.validate.field).string.max_bytes = 256];
  // regex 正则，至多 256 字节；replace 留空为 "(.*)"，其余动作必填。
  string regex = 4 [(buf.validate.field).string.max_bytes = 256];
  // target_label 写入的标签名，仅 replace 使用且必填；不得以 __ 开头。
  string target_label = 5 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^([a-zA-Z_][a-zA-Z0-9_]*)?$"
  }];
  // replacement 替换内容，replace / labelmap 使用，至多 256 字节；留空为 "$1"。
  string replacement = 6 [(buf.validate.field).string.max_bytes = 256];
}

// RuleTicketAction 触发时自动建单：同一事件只建一张工单，告警恢复时在工单上追加一条记录。
message RuleTicketAction {
  // enabled 是否启用；启用时 template_id 与 agent_user_id 必填。
  bool enabled = 1;
  // template_id 工单模板。
  string template_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // agent_user_id 代理提单人：工单以他的名义创建，能否提单、能否关联资源按他的权限判定；须是可用用户。
  // 该用户之后被停用时自动建单失败，并记入事件时间线。
  string agent_user_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// RuleWorkflowAction 触发时发起一个流程（业务类型 monitor_alert，业务 ID 为事件 ID），事件内容作为流程变量：
// alert_id、alert_url、rule_id、rule_name、group_name、datasource_name、severity、value、labels、annotations、
// first_fire_time、ci_id、ci_name。
message RuleWorkflowAction {
  // enabled 是否启用；启用时 definition_key 与 agent_user_id 必填。
  bool enabled = 1;
  // definition_key 流程标识（须有已发布的版本）。
  string definition_key = 2 [(buf.validate.field).string.max_len = 64];
  // agent_user_id 流程的发起人；须是可用用户。
  string agent_user_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// RuleActions 规则触发后的事件动作；每个事件每种动作至多执行一次。
message RuleActions {
  option (buf.validate.message).cel = {
    id: "monitor.rule.actions.ticket"
    message: "ticket.template_id and ticket.agent_user_id are required when ticket.enabled is true"
    expression: "!has(this.ticket) || !this.ticket.enabled || (this.ticket.template_id != '' && this.ticket.agent_user_id != '')"
  };
  option (buf.validate.message).cel = {
    id: "monitor.rule.actions.workflow"
    message: "workflow.definition_key and workflow.agent_user_id are required when workflow.enabled is true"
    expression: "!has(this.workflow) || !this.workflow.enabled || (this.workflow.definition_key != '' && this.workflow.agent_user_id != '')"
  };

  // ticket 自动建单，可选。
  RuleTicketAction ticket = 1;
  // workflow 触发流程，可选。
  RuleWorkflowAction workflow = 2;
  // ai_summary 触发后由 AI 生成事件摘要与排查建议（写入事件的 ai_summary）；智能助手未配置模型密钥时不生成。
  bool ai_summary = 3;
}

// RuleSpec 规则的可编辑内容（新建、编辑、历史版本、导入预览共用）。
message RuleSpec {
  option (buf.validate.message).cel = {
    id: "monitor.rule.datasource_scope"
    message: "datasource_ids must have 1-20 items when datasource_scope is 1 and be empty when it is 2"
