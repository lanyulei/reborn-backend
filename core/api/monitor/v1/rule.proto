  RuleActions actions = 28;
}

// RuleEvalTask 规则在一个数据源上的评估状态。
message RuleEvalTask {
  // datasource_id 数据源唯一标识。
  string datasource_id = 1;
  // datasource_name 数据源名称。
  string datasource_name = 2;
  // last_status 最近一次评估结果：0=未评估 1=正常 2=告警中 3=无数据 4=查询错误 5=不在生效时间。
  int32 last_status = 3;
  // last_eval_time 最近一次评估时间。
  google.protobuf.Timestamp last_eval_time = 4;
  // last_error 最近一次评估的错误信息。
  string last_error = 5;
  // last_duration_ms 最近一次评估耗时毫秒。
  int32 last_duration_ms = 6;
  // firing_count 当前告警中的序列数。
  int32 firing_count = 7;
  // next_eval_time 下次评估时间。
  google.protobuf.Timestamp next_eval_time = 8;
}

// Rule 告警规则。
message Rule {
  // id 规则唯一标识。
  string id = 1;
  // spec 规则内容。
  RuleSpec spec = 2;
  // group_name 所属分组的完整名称（含上级，以 " / " 分隔）。
  string group_name = 3;
  // datasources 指定数据源的名称（与 spec.datasource_ids 对应）；范围为全部数据源时为空。
  repeated NamedRef datasources = 4;
  // notify_users 通知用户的显示名（与 spec.notify.user_ids 对应）。
  repeated NamedRef notify_users = 5;
  // notify_schedules 通知值班表的名称（与 spec.notify.schedule_ids 对应）。
  repeated NamedRef notify_schedules = 6;
  // notify_depts 通知部门的名称（与 spec.notify.dept_ids 对应）。
  repeated NamedRef notify_depts = 7;
  // max_severity 各查询中的最高级别（列表展示用）。
  int32 max_severity = 8;
  // version 版本号：每次保存 +1；编辑时原样传回用作乐观锁。
  int32 version = 9;
  // status 评估状态汇总（各数据源中取最需要关注的一个）：0=未评估 1=正常 2=告警中 3=无数据
  // 4=查询错误 5=不在生效时间；规则停用时为 0。优先级：告警中 > 查询错误 > 无数据 > 正常 > 不在生效时间。
  int32 status = 10;
  // firing_count 当前告警中的序列数（各数据源合计）。
  int32 firing_count = 11;
  // last_eval_time 最近一次评估时间（各数据源中最新的）。
  google.protobuf.Timestamp last_eval_time = 12;
  // last_error 最近一次评估的错误信息（任一数据源出错时）。
  string last_error = 13;
  // eval_tasks 在各数据源上的评估状态；仅详情接口返回。
  repeated RuleEvalTask eval_tasks = 14;
  // can_manage 当前用户能否管理本规则（对所在分组「可管理」）。
  bool can_manage = 15;
  // create_time 创建时间。
  google.protobuf.Timestamp create_time = 16;
  // update_time 更新时间。
  google.protobuf.Timestamp update_time = 17;
  // update_user_id 最近更新人。
  string update_user_id = 18;
  // update_user_name 最近更新人显示名。
  string update_user_name = 19;
  // escalation 引用的升级策略的名称（与 spec.escalation_id 对应）；未引用时为空。
  NamedRef escalation = 20;
  // ticket_template 自动建单的工单模板名称（与 spec.actions.ticket.template_id 对应）。
  NamedRef ticket_template = 21;
  // ticket_agent 自动建单的代理提单人显示名。
  NamedRef ticket_agent = 22;
  // workflow_definition 触发的流程名称（id 为流程标识 definition_key）。
  NamedRef workflow_definition = 23;
  // workflow_agent 流程发起人显示名。
  NamedRef workflow_agent = 24;
}

// ListRulesRequest 分页查询告警规则请求。
message ListRulesRequest {
  // page 页码，从 1 开始。
  int64 page = 1 [(buf.validate.field).int64.gte = 1];
  // page_size 每页数量，1-100。
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // group_id 规则分组过滤（含其全部下级分组），可选。
  optional string group_id = 3 [(buf.validate.field).string.uuid = true];
  // keyword 名称 / 说明 / PromQL 模糊匹配，可选。
  optional string keyword = 4 [(buf.validate.field).string.max_len = 128];
  // severity 级别过滤（任一查询为该级别），可选：1=提示 2=警告 3=严重 4=致命。
  optional int32 severity = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 4
  }];
  // datasource_id 数据源过滤（指定了该数据源，或范围为全部数据源的规则），可选。
  optional string datasource_id = 6 [(buf.validate.field).string.uuid = true];
  // enabled 启用状态过滤，可选。
  optional bool enabled = 7;
  // firing 是否正在告警（存在活跃告警事件），可选。
  optional bool firing = 8;
  // last_status 最近一次评估结果过滤（任一数据源为该结果），可选：0=未评估 1=正常 2=告警中
  // 3=无数据 4=查询错误 5=不在生效时间。
  optional int32 last_status = 9 [(buf.validate.field).int32 = {
    gte: 0
    lte: 5
  }];
  // labels 附加标签过滤，每项形如 name=value，至多 5 项，各项之间是「并且」，可选。
  repeated string labels = 10 [(buf.validate.field).repeated = {
    max_items: 5
    items: {
      string: {
        max_len: 400
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*=.+$"
      }
    }
  }];
  // escalation_id 升级策略过滤（引用了该策略的规则），可选。
  optional string escalation_id = 11 [(buf.validate.field).string.uuid = true];
}

// ListRulesResponse 分页查询告警规则响应。
message ListRulesResponse {
  // items 当前页数据。
  repeated Rule items = 1;
  // total 总数。
  int64 total = 2;
}

// GetRuleRequest 查询规则详情请求。
message GetRuleRequest {
  // id 规则唯一标识。
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetRuleResponse 查询规则详情响应。
message GetRuleResponse {
  // rule 规则。
  Rule rule = 1;
}

// CreateRuleRequest 新建规则请求。
message CreateRuleRequest {
  // spec 规则内容。
  RuleSpec spec = 1 [(buf.validate.field).required = true];
}

// CreateRuleResponse 新建规则响应。
message CreateRuleResponse {
  // rule 新建的规则。
