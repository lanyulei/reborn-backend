syntax = "proto3";

package cmdb.v1;

import "google/api/annotations.proto";
import "buf/validate/validate.proto";
import "cmdb/v1/ci.proto";
import "system/v1/annotations.proto";

option go_package = "github.com/lanyulei/reborn/backend/core/api/cmdb/v1;v1";

// CmdbRelationService 资源关联：在当前资源上完成关联已有、解除、迁移与关联数据查询；
// 关系类型元数据决定允许的两端类型与基数，冲突返回可读原因。
service CmdbRelationService {
  // LinkCIs 把当前资源与若干目标资源建立关系（批量）；任一目标不合规整体失败。
  rpc LinkCIs(LinkCIsRequest) returns (LinkCIsResponse) {
    option (google.api.http) = {
      post: "/api/v1/cmdb/ci/{ci_id}/relation"
      body: "*"
    };
    option (system.v1.title) = "建立资源关联";
  }
  // UnlinkCI 解除当前资源与目标资源的关系（只解关系，不删资源）。
  rpc UnlinkCI(UnlinkCIRequest) returns (UnlinkCIResponse) {
    option (google.api.http) = {
      post: "/api/v1/cmdb/ci/{ci_id}/relation:unlink"
      body: "*"
    };
    option (system.v1.title) = "解除资源关联";
  }
  // MoveCI 关系迁移：解除与 from 的关系并与 to 建立关系，同一事务，一条历史。
  rpc MoveCI(MoveCIRequest) returns (MoveCIResponse) {
    option (google.api.http) = {
      post: "/api/v1/cmdb/ci/{ci_id}/relation:move"
      body: "*"
    };
    option (system.v1.title) = "迁移资源关联";
  }
  // ListRelated 分页查询当前资源在某关系类型某方向上的关联资源（含对端资源属性）。
  rpc ListRelated(ListRelatedRequest) returns (ListRelatedResponse) {
    option (google.api.http) = {
      get: "/api/v1/cmdb/ci/{ci_id}/related"
    };
    option (system.v1.title) = "查询关联资源";
  }
  // Neighbors 资源拓扑：以当前资源为中心按层展开关联（层数 ≤3、节点 ≤500）。
  rpc Neighbors(NeighborsRequest) returns (NeighborsResponse) {
    option (google.api.http) = {
      get: "/api/v1/cmdb/ci/{ci_id}/neighbors"
    };
    option (system.v1.title) = "查询资源拓扑";
  }
}

// LinkCIsRequest 建立关系请求。
message LinkCIsRequest {
  // ci_id 当前资源。
  string ci_id = 1 [(buf.validate.field).string.uuid = true];
  // relation_type 关系类型编码。
  string relation_type = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // direction 方向：outgoing 当前资源为 src / incoming 当前资源为 dst。
  string direction = 3 [(buf.validate.field).string = { in: ["outgoing", "incoming"] }];
  // target_ids 目标资源，1-100 个。
  repeated string target_ids = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: { uuid: true }
    }
  }];
}

// LinkCIsResponse 建立关系响应。
message LinkCIsResponse {
  // linked 实际新建的关系数（已存在的跳过）。
  int32 linked = 1;
}

// UnlinkCIRequest 解除关系请求。
message UnlinkCIRequest {
  // ci_id 当前资源。
  string ci_id = 1 [(buf.validate.field).string.uuid = true];
  // relation_type 关系类型编码。
  string relation_type = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // direction 方向。
  string direction = 3 [(buf.validate.field).string = { in: ["outgoing", "incoming"] }];
  // target_id 目标资源。
  string target_id = 4 [(buf.validate.field).string.uuid = true];
}

// UnlinkCIResponse 解除关系响应。
message UnlinkCIResponse {}

// MoveCIRequest 关系迁移请求（如配件从主机 A 迁到主机 B）。
message MoveCIRequest {
  // ci_id 当前资源。
  string ci_id = 1 [(buf.validate.field).string.uuid = true];
  // relation_type 关系类型编码。
  string relation_type = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // direction 方向。
  string direction = 3 [(buf.validate.field).string = { in: ["outgoing", "incoming"] }];
  // from_id 原目标资源。
  string from_id = 4 [(buf.validate.field).string.uuid = true];
  // to_id 新目标资源。
  string to_id = 5 [(buf.validate.field).string.uuid = true];
}

// MoveCIResponse 关系迁移响应。
message MoveCIResponse {}

// ListRelatedRequest 查询关联资源请求。
message ListRelatedRequest {
  // ci_id 当前资源。
  string ci_id = 1 [(buf.validate.field).string.uuid = true];
  // relation_type 关系类型编码。
  string relation_type = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // direction 方向。
  string direction = 3 [(buf.validate.field).string = { in: ["outgoing", "incoming"] }];
  // keyword 对端名称模糊匹配，可选。
  optional string keyword = 4 [(buf.validate.field).string.max_len = 128];
  // page 页码，从 1 开始。
  int64 page = 5 [(buf.validate.field).int64.gte = 1];
  // page_size 每页数量，1-100。
  int32 page_size = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
}

// RelatedCI 关联资源条目。
message RelatedCI {
  // relation_id 关系实例标识。
  string relation_id = 1;
  // ci 对端资源。
  CmdbCI ci = 2;
}

// ListRelatedResponse 查询关联资源响应。
message ListRelatedResponse {
  // items 当前页数据。
  repeated RelatedCI items = 1;
  // total 总数。
  int64 total = 2;
}

// NeighborsRequest 拓扑查询请求。
message NeighborsRequest {
  // ci_id 中心资源。
  string ci_id = 1 [(buf.validate.field).string.uuid = true];
  // depth 展开层数，1-3，缺省 2。
  optional int32 depth = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 3
  }];
  // max_nodes 节点上限，1-500，缺省 200。
  optional int32 max_nodes = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 500
  }];
}

// TopologyNode 拓扑节点。
message TopologyNode {
  // id 资源标识。
  string id = 1;
  // name 名称。
  string name = 2;
  // model_code 类型编码。
  string model_code = 3;
  // model_name 类型名。
  string model_name = 4;
  // status 状态。
  string status = 5;
  // env 环境。
  string env = 6;
  // depth 距中心层数（中心为 0）。
  int32 depth = 7;
}

// TopologyEdge 拓扑边（有向 src → dst）。
message TopologyEdge {
  // id 关系标识。
  string id = 1;
  // relation_type 关系类型编码。
  string relation_type = 2;
  // name 关系正向名称。
  string name = 3;
  // src_id 源端资源。
  string src_id = 4;
  // dst_id 目标端资源。
  string dst_id = 5;
}

// NeighborsResponse 拓扑查询响应。
message NeighborsResponse {
  // nodes 节点（含中心）。
  repeated TopologyNode nodes = 1;
  // edges 边。
  repeated TopologyEdge edges = 2;
  // truncated 因节点上限被截断。
  bool truncated = 3;
}
