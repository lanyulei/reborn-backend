# 管道服务启动配置；密钥类字段从环境变量注入，禁止在本文件写入明文口令。
# 数据库连接（data.database）与凭据加密主密钥（notify.master.key）全部服务一致，定义在共享基线
# kit/bootstrap/shared.yaml，取值由环境变量注入（KRATOS_DATA_DATABASE_SOURCE / KRATOS_NOTIFY_MASTER_KEY，
# 本地见 backend/.env.example）；这里只写本服务特有的段，以及要偏离基线的值。
server:
  http:
    # 8010 为 core；管道走 8020。HTTP 恒启动（/healthz /metrics），ingress 接口
    # 仅 api 角色注册；数据面只暴露 HTTP（HMAC 签名绑定请求体）。
    addr: 0.0.0.0:8020
    timeout: 5s
data:
  database:
    # 与 core 同库（配置表只读、运行表读写）；生产环境的账号用 notify_pipe_role 成员（见 core/migrations/0021）。
    # 管道并发高于其它服务，连接池大于共享基线（16 / 2）。
    max_conns: 32
    min_conns: 4
pipeline:
  # roles 为空 = 全部角色；部署时用 SERVER_ROLES=api,router 等覆盖。
  roles: []
  # backbone: pg（缺省）或 nats（JetStream 作队列游标，PG 仍为事实源；需启用 relay 角色）。
  backbone: pg
  # nats:
  #   url: nats://127.0.0.1:4222
  #   token: ${KRATOS_NATS_TOKEN}
  #   stream_prefix: NOTIFY
  #   ack_wait: 120s
  #   max_deliver: 20
  #   relay_poll: 0.2s
  #   relay_batch: 500
  #   replicas: 1
  router:
    poll_interval: 0.2s
    batch_size: 500
    config_poll: 10s
    sweep_interval: 1s
    max_aggregate_window: 300s
    max_route_attempts: 5
  sender:
    poll_interval: 0.2s
    batch_size: 100
    concurrency: 16
    lease: 300s
    send_timeout: 3s
    max_send_timeout: 10s
    render_timeout: 0.1s
    reap_interval: 30s
    max_attempts: 6
  dlq:
    poll_interval: 5s
    batch_size: 100
  maintenance:
    interval: 3600s
    partitions_ahead: 2
    retention:
      event: 15552000s        # 180d
      dispatch: 15552000s     # 180d
      delivery_log: 7776000s  # 90d
      dlq: 15552000s          # 180d
      dedup: 86400s           # 24h
      agg_group: 604800s      # 7d
  ingress:
    clock_skew: 300s
