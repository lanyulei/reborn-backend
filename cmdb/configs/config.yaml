# CMDB 数据面（采集 / 对账）启动配置；密钥类字段从环境变量注入，禁止在本文件写入明文口令。
# 数据库连接（data.database）与凭据加密主密钥（notify.master.key）全部服务一致，定义在共享基线
# kit/bootstrap/shared.yaml，取值由环境变量注入（KRATOS_DATA_DATABASE_SOURCE / KRATOS_NOTIFY_MASTER_KEY，
# 本地见 backend/.env.example）；这里只写本服务特有的段，以及要偏离基线的值。
# 生产环境的数据库账号用 cmdb_sync_role 成员（见 core/migrations/0034）。
server:
  http:
    # 8010 为 core、8020 为通知管道；数据面走 8030，只暴露 /healthz 与 /metrics。
    addr: 0.0.0.0:8030
    timeout: 5s
sync:
  # roles 为空 = 全部角色（scheduler / worker / webhook）；部署时用 SERVER_ROLES=worker 等覆盖。
  # webhook 角色暴露 POST /webhook/v1/cmdb/sync/{source_id}（令牌头 X-Cmdb-Webhook-Token）。
  roles: []
  scheduler:
    poll_interval: 10s
    stale_multiplier: 3
    staging_retention: 86400s
  worker:
    poll_interval: 2s
    concurrency: 2
    lease: 300s
    collect_timeout: 600s
    request_timeout: 3s
    staging_batch: 500
  maintenance:
    interval: 3600s
    partitions_ahead: 2
    history_retention: 31536000s  # 365d；0 = 不删除
    # 同步任务与运行记录的保留期；每个采集源最近一次运行始终保留。
    run_retention: 15552000s  # 180d；0 = 不清理
